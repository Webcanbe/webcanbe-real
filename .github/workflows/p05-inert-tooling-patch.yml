name: P05 Inert Tooling Patch

on:
  push:
    branches:
      - phase2-p05-parallel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-p05-parallel
      - name: Add shared inert package-manager tooling role
        run: |
          python - <<'PY'
          from pathlib import Path

          intake=Path('src/webcanbe-engine/runtime/intakeMetadata.ts')
          s=intake.read_text()
          needle='export const METADATA_BYTES = 16 * 1024\n'
          insert='''export const METADATA_BYTES = 16 * 1024\nexport const INERT_TOOL_BYTES = 4 * 1024 * 1024\n/** Exact operator-independent role for bundled package-manager tooling. These bytes are\n * preserved for source ownership/export only and never become executable editor input. */\nexport function isInertToolingPath(name: string) {\n  return /^\\.yarn\\/releases\\/yarn-\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}(?:[-+][0-9A-Za-z.-]{1,64})?\\.cjs$/.test(name)\n}\nexport function archiveMemberLimit(name: string) { return isInertToolingPath(name) ? INERT_TOOL_BYTES : 2 * 1024 * 1024 }\n'''
          if needle not in s: raise SystemExit('intake metadata insertion point missing')
          intake.write_text(s.replace(needle,insert,1))

          registry=Path('src/webcanbe-engine/runtime/projectRegistry.ts')
          s=registry.read_text()
          old='import { isOpaqueBunLock, isExampleEnvironment, isInertMetadata, validateIntakeMetadata } from "./intakeMetadata"'
          new='import { archiveMemberLimit, isInertToolingPath, isOpaqueBunLock, isExampleEnvironment, isInertMetadata, validateIntakeMetadata } from "./intakeMetadata"'
          if old not in s: raise SystemExit('projectRegistry import point missing')
          s=s.replace(old,new,1)
          s=s.replace('entry.uncompressedSize > ZIP_LIMITS.fileBytes || total + entry.uncompressedSize > ZIP_LIMITS.totalBytes', 'entry.uncompressedSize > archiveMemberLimit(name) || total + entry.uncompressedSize > ZIP_LIMITS.totalBytes',1)
          s=s.replace('if (size > ZIP_LIMITS.fileBytes || total > ZIP_LIMITS.totalBytes)', 'if (size > archiveMemberLimit(name) || total > ZIP_LIMITS.totalBytes)',1)
          old_text='if (!isOpaqueBunLock(path.posix.basename(name),content) && !/\\.(png|jpe?g|gif|webp|ico|woff2?)$/i.test(name)) { if (content.includes(0)) throw new Error("Binary data in a text file."); new TextDecoder("utf-8", { fatal: true }).decode(content) }'
          new_text='if (!isOpaqueBunLock(path.posix.basename(name),content) && !isInertToolingPath(name) && !/\\.(png|jpe?g|gif|webp|ico|woff2?)$/i.test(name)) { if (content.includes(0)) throw new Error("Binary data in a text file."); new TextDecoder("utf-8", { fatal: true }).decode(content) }'
          if old_text not in s: raise SystemExit('projectRegistry text gate missing')
          registry.write_text(s.replace(old_text,new_text,1))

          export=Path('src/webcanbe-engine/runtime/projectExport.ts')
          s=export.read_text()
          s=s.replace('import { isWithin, safeArchivePath, ZIP_LIMITS, type ProjectRecord } from "./projectRegistry"','import { isWithin, safeArchivePath, ZIP_LIMITS, type ProjectRecord } from "./projectRegistry"\nimport { archiveMemberLimit } from "./intakeMetadata"',1)
          old='bytes.length > ZIP_LIMITS.fileBytes'
          if old not in s: raise SystemExit('projectExport member bound missing')
          export.write_text(s.replace(old,'bytes.length > archiveMemberLimit(relative)',1))

          preview=Path('src/webcanbe-engine/runtime/isolatedPreview.ts')
          s=preview.read_text()
          anchor='import { isWithin, safeArchivePath, type ProjectRecord } from "./projectRegistry"\n'
          if anchor not in s: raise SystemExit('isolatedPreview import anchor missing')
          s=s.replace(anchor,anchor+'import { isInertToolingPath } from "./intakeMetadata"\n',1)
          old='''        const actual = fs.realpathSync(resolved)\n        if (!vendorImporter) {'''
          new='''        const actual = fs.realpathSync(resolved)\n        const projectRelative = path.relative(root, actual).split(path.sep).join("/")\n        if (!vendorImporter && isInertToolingPath(projectRelative)) throw new Error("Inert package-manager tooling cannot be imported or executed.")\n        if (!vendorImporter) {'''
          if old not in s: raise SystemExit('isolatedPreview resolution anchor missing')
          preview.write_text(s.replace(old,new,1))

          real=Path('src/webcanbe-engine/phase2-p05-redux-real.test.ts')
          s=real.read_text()
          old="""  const typescript=lock.resolve('typescript',manifest.devDependencies.typescript)\n  expect(typescript.version).toBe('5.4.5')\n  expect(typescript.berryLocator).toContain('builtin<compat/typescript>')\n"""
          new="""  const typescript=lock.resolve('typescript',manifest.devDependencies.typescript)\n  expect(typescript.version).toBe('5.4.5')\n  expect(typescript.berryLocator).toBe('typescript@npm:5.4.5')\n  const patched=lock.resolve('typescript','patch:typescript@npm%3A^5.4#optional!builtin<compat/typescript>')\n  expect(patched.version).toBe('5.4.5')\n  expect(patched.berryLocator).toContain('builtin<compat/typescript>')\n"""
          if old not in s: raise SystemExit('real Redux patch assertion anchor missing')
          real.write_text(s.replace(old,new,1))
          PY
      - name: Add targeted inert tooling tests
        run: |
          cat > src/webcanbe-engine/phase2-p05-inert-tooling.test.ts <<'EOF'
          import {afterEach,expect,it} from 'vitest'
          import fs from 'node:fs'
          import os from 'node:os'
          import path from 'node:path'
          import {ZipFile} from 'yazl'
          import {archiveMemberLimit,isInertToolingPath} from './runtime/intakeMetadata'
          import {extractSafeZip,detectProject,type ProjectRecord} from './runtime/projectRegistry'
          import {exportProjectZip} from './runtime/projectExport'
          import {buildIsolatedHttpPreview} from './runtime/isolatedPreview'
          import {MutationHistory} from './mutations/sourceMutations'

          const dirs:string[]=[]
          afterEach(()=>dirs.splice(0).forEach(d=>fs.rmSync(d,{recursive:true,force:true})))
          const zipOf=(entries:Record<string,Buffer|string>)=>new Promise<Buffer>((resolve,reject)=>{const zip=new ZipFile(),chunks:Buffer[]=[];for(const [name,value] of Object.entries(entries))zip.addBuffer(Buffer.isBuffer(value)?value:Buffer.from(value),name);zip.outputStream.on('data',c=>chunks.push(Buffer.from(c)));zip.outputStream.on('end',()=>resolve(Buffer.concat(chunks)));zip.outputStream.on('error',reject);zip.end()})

          it('gives only exact bundled Yarn release paths a larger inert preservation bound',()=>{
            expect(isInertToolingPath('.yarn/releases/yarn-4.2.2.cjs')).toBe(true)
            expect(archiveMemberLimit('.yarn/releases/yarn-4.2.2.cjs')).toBe(4*1024*1024)
            for(const name of ['src/yarn-4.2.2.cjs','.yarn/releases/evil.cjs','.yarn/releases/yarn-4.2.cjs','.yarn/releases/yarn-4.2.2.js','.yarn/../releases/yarn-4.2.2.cjs'])expect(isInertToolingPath(name)).toBe(false)
            expect(archiveMemberLimit('src/large.cjs')).toBe(2*1024*1024)
          })

          it('round-trips an oversized inert Yarn release while the ordinary 2 MiB member boundary remains',async()=>{
            const root=fs.mkdtempSync(path.join(os.tmpdir(),'wcb-inert-'));dirs.push(root)
            const inert=Buffer.alloc(2_742_928,0x61)
            const archive=await zipOf({'.yarn/releases/yarn-4.2.2.cjs':inert,'package.json':'{}'})
            await extractSafeZip(archive,root)
            expect(fs.readFileSync(path.join(root,'.yarn/releases/yarn-4.2.2.cjs')).equals(inert)).toBe(true)
            const project={id:'p',name:'p',root,sourceRoot:path.join(root,'src'),imported:true,detection:{supported:false,framework:'unknown',tailwind:false,dependencies:[]},history:new MutationHistory()} as ProjectRecord
            const out=await exportProjectZip(project),copy=fs.mkdtempSync(path.join(os.tmpdir(),'wcb-inert-copy-'));dirs.push(copy)
            await extractSafeZip(out,copy)
            expect(fs.readFileSync(path.join(copy,'.yarn/releases/yarn-4.2.2.cjs')).equals(inert)).toBe(true)
            await expect(extractSafeZip(await zipOf({'src/large.cjs':Buffer.alloc(2*1024*1024+1,0x61)}),fs.mkdtempSync(path.join(os.tmpdir(),'wcb-large-')))).rejects.toThrow('Unsafe ZIP')
          })

          it('preserves inert tooling as source-owned bytes but refuses importing it into the controlled browser graph',async()=>{
            const root=fs.mkdtempSync(path.join(os.tmpdir(),'wcb-inert-preview-'));dirs.push(root)
            const profile=JSON.parse(fs.readFileSync('runtime-profiles/react19-vite6/package.json','utf8'))
            fs.mkdirSync(path.join(root,'src'),{recursive:true});fs.mkdirSync(path.join(root,'.yarn/releases'),{recursive:true})
            fs.writeFileSync(path.join(root,'package.json'),JSON.stringify({dependencies:profile.dependencies}))
            fs.writeFileSync(path.join(root,'index.html'),'<div id="root"></div><script type="module" src="/src/main.jsx"></script>')
            fs.writeFileSync(path.join(root,'src/main.jsx'),`import '../.yarn/releases/yarn-4.2.2.cjs';import {createRoot} from 'react-dom/client';createRoot(document.getElementById('root')).render(<h1>blocked</h1>)`)
            fs.writeFileSync(path.join(root,'.yarn/releases/yarn-4.2.2.cjs'),'throw new Error("must never execute")')
            const detection=detectProject(root,process.cwd()),project={id:'p',name:'p',root,sourceRoot:path.join(root,'src'),imported:true,detection,history:new MutationHistory()} as ProjectRecord
            await expect(buildIsolatedHttpPreview(project,process.cwd())).rejects.toThrow('Inert package-manager tooling cannot be imported or executed')
          })
          EOF
      - name: Verify targeted P05 slice
        run: |
          npm ci --ignore-scripts
          npx tsc --pretty false
          npx vitest run src/webcanbe-engine/phase2-p05-berry.test.ts src/webcanbe-engine/phase2-p05-inert-tooling.test.ts
      - name: Commit verified changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/webcanbe-engine/runtime/intakeMetadata.ts src/webcanbe-engine/runtime/projectRegistry.ts src/webcanbe-engine/runtime/projectExport.ts src/webcanbe-engine/runtime/isolatedPreview.ts src/webcanbe-engine/phase2-p05-redux-real.test.ts src/webcanbe-engine/phase2-p05-inert-tooling.test.ts
          git commit -m 'feat: preserve oversized inert package-manager tooling safely'
          git push origin HEAD:phase2-p05-parallel
