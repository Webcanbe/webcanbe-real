name: Phase 5 Firebase popup CSP verify
on:
  push:
    branches: [phase5-firebase-csp-popup]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Focused Firebase/CSP regressions
        run: npx vitest run worker/security-headers.test.js src/phase5-csp-compat.test.ts src/phase5-firebase-auth.test.ts src/phase5-production-public-smoke.test.ts
      - name: Worker syntax
        run: node --check worker/security-headers.js && node --check worker/index.js
      - name: Production build
        run: npm run build
      - name: Worker bundle dry run
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
