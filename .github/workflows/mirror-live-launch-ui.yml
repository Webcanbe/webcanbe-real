name: Mirror live Launch UI homepage
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Replace demo port with live homepage snapshot
        shell: bash
        run: |
          set -euo pipefail

          # Restore app/tooling files from the checkpoint before the earlier demo-source port.
          git show 543ddfb2d2981f440d347726886ae1bd87fdc6fe:package.json > package.json
          git show 543ddfb2d2981f440d347726886ae1bd87fdc6fe:package-lock.json > package-lock.json
          git show 543ddfb2d2981f440d347726886ae1bd87fdc6fe:tsconfig.json > tsconfig.json
          git show 543ddfb2d2981f440d347726886ae1bd87fdc6fe:vite.config.ts > vite.config.ts
          rm -rf src/launch-ui
          rm -f public/dashboard-light.png public/dashboard-dark.png
          rm -rf public/launch-ui-live
          mkdir -p public/launch-ui-live

          python3 <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin, urlparse, parse_qs, unquote
          import html as htmlmod
          import re

          ORIGIN = "https://www.launchuicomponents.com/"
          OUT = Path("public/launch-ui-live")
          OUT.mkdir(parents=True, exist_ok=True)

          def fetch(url: str) -> bytes:
              req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(req, timeout=60) as r:
                  return r.read()

          raw = fetch(ORIGIN).decode("utf-8", "replace")

          # Save the exact live HTML as the source record before local-path adaptation.
          (OUT / "live-source.html").write_text(raw, encoding="utf-8")

          # Remove Next.js runtime scripts so the mirrored page renders as stable server HTML
          # instead of trying to hydrate against the WebCanBe origin.
          page = re.sub(r'<script\b[^>]*>.*?</script>', '', raw, flags=re.I | re.S)
          page = re.sub(r'<link\b[^>]*rel=["\'](?:modulepreload|preload)["\'][^>]*as=["\']script["\'][^>]*>', '', page, flags=re.I)

          # Download CSS files and rewrite them to the mirror namespace.
          css_hrefs = []
          for m in re.finditer(r'<link\b[^>]*rel=["\']stylesheet["\'][^>]*href=["\']([^"\']+)["\'][^>]*>', page, flags=re.I):
              css_hrefs.append(htmlmod.unescape(m.group(1)))

          downloaded = set()
          def local_for_url(url: str, base_dir: Path = OUT) -> Path:
              p = urlparse(url)
              path = p.path.lstrip("/")
              if not path:
                  path = "index"
              return base_dir / path

          def save_url(url: str, dest: Path):
              key = (url, str(dest))
              if key in downloaded:
                  return
              downloaded.add(key)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(fetch(url))

          for href in sorted(set(css_hrefs)):
              full = urljoin(ORIGIN, href)
              parsed = urlparse(full)
              if parsed.netloc not in {"www.launchuicomponents.com", "launchuicomponents.com"}:
                  continue
              dest = local_for_url(full)
              save_url(full, dest)
              css = dest.read_text(encoding="utf-8", errors="replace")

              # Download same-origin assets referenced by CSS and rewrite them locally.
              def css_url_repl(match):
                  q = match.group(1).strip().strip('"\'')
                  if not q or q.startswith("data:") or q.startswith("#"):
                      return match.group(0)
                  asset_url = urljoin(full, q)
                  ap = urlparse(asset_url)
                  if ap.netloc not in {"www.launchuicomponents.com", "launchuicomponents.com"}:
                      return match.group(0)
                  asset_dest = local_for_url(asset_url)
                  try:
                      save_url(asset_url, asset_dest)
                      rel = "/" + str(asset_dest).replace("public/", "")
                      return f"url('{rel}')"
                  except Exception:
                      return match.group(0)

              css = re.sub(r'url\(([^)]+)\)', css_url_repl, css)
              dest.write_text(css, encoding="utf-8")
              page = page.replace(href, "/" + str(dest).replace("public/", ""))

          # Replace Next image-optimizer URLs with locally downloaded original assets.
          optimizer_pattern = re.compile(r'/_next/image\?url=([^&"\']+)(?:&amp;|&)w=\d+(?:&amp;|&)q=\d+')
          optimizer_targets = {}
          for m in list(optimizer_pattern.finditer(page)):
              encoded = htmlmod.unescape(m.group(1))
              original_path = unquote(encoded)
              asset_url = urljoin(ORIGIN, original_path)
              parsed = urlparse(asset_url)
              if parsed.netloc not in {"www.launchuicomponents.com", "launchuicomponents.com"}:
                  continue
              filename = parsed.path.lstrip("/")
              if not filename:
                  continue
              dest = OUT / "assets" / filename
              try:
                  save_url(asset_url, dest)
                  optimizer_targets[m.group(0)] = "/" + str(dest).replace("public/", "")
              except Exception:
                  pass
          for old, new in optimizer_targets.items():
              page = page.replace(old, new)

          # Download direct same-origin image/media references in the document.
          direct_patterns = [
              r'(?P<attr>src|poster)=["\'](?P<url>/[^"\']+\.(?:png|jpg|jpeg|webp|svg|gif|avif))["\']',
          ]
          for pat in direct_patterns:
              def repl(match):
                  path = htmlmod.unescape(match.group("url"))
                  asset_url = urljoin(ORIGIN, path)
                  dest = OUT / "assets" / path.lstrip("/")
                  try:
                      save_url(asset_url, dest)
                      local = "/" + str(dest).replace("public/", "")
                      return f'{match.group("attr")}="{local}"'
                  except Exception:
                      return match.group(0)
              page = re.sub(pat, repl, page, flags=re.I)

          # Keep navigation behavior semantically identical to the live site:
          # relative site links still open the real Launch UI destination.
          def href_repl(match):
              href = htmlmod.unescape(match.group(1))
              if href.startswith("/") and not href.startswith("//"):
                  return f'href="{urljoin(ORIGIN, href)}"'
              return match.group(0)
          page = re.sub(r'href=["\']([^"\']+)["\']', href_repl, page, flags=re.I)

          # Add a base tag so any remaining relative resource resolves against the live origin.
          if "<head>" in page:
              page = page.replace("<head>", f'<head><base href="{ORIGIN}">', 1)

          (OUT / "index.html").write_text(page, encoding="utf-8")

          # Sanity checks against the CURRENT live homepage, not the small public demo repo.
          required = [
              "Give your big idea the design it deserves",
              "It's all about design quality",
              "Everything you need. Nothing you don't.",
              "What's inside?",
          ]
          missing = [s for s in required if s not in raw]
          if missing:
              raise SystemExit(f"Live homepage signature changed or capture failed: {missing}")
          PY

          cat > src/Home.tsx <<'EOF'
          export default function Home() {
            return (
              <iframe
                title="Launch UI"
                src="/launch-ui-live/index.html"
                style={{
                  position: "fixed",
                  inset: 0,
                  width: "100vw",
                  height: "100vh",
                  border: 0,
                  display: "block",
                  background: "#000",
                }}
              />
            )
          }
          EOF

          cat > src/phase3-landing.test.ts <<'EOF'
          import fs from "node:fs"
          import { describe, expect, it } from "vitest"

          describe("Phase 4 live Launch UI landing mirror", () => {
            it("uses the live Launch UI homepage snapshot at the public root", () => {
              const home = fs.readFileSync("src/Home.tsx", "utf8")
              const page = fs.readFileSync("public/launch-ui-live/index.html", "utf8")
              const source = fs.readFileSync("public/launch-ui-live/live-source.html", "utf8")
              const app = fs.readFileSync("src/App.tsx", "utf8")

              expect(home).toContain('src="/launch-ui-live/index.html"')
              for (const marker of [
                "Give your big idea the design it deserves",
                "It's all about design quality",
                "Everything you need. Nothing you don't.",
                "What's inside?",
              ]) expect(source).toContain(marker)

              expect(page.length).toBeGreaterThan(50000)
              expect(page).not.toContain("<script")
              for (const productRoute of ["/browse", "/project/", "/login", "/signup", "/workspace/", "/projects", "/dashboard", "/settings", "/plans", "/seller"]) expect(app).toContain(productRoute)
            })
          })
          EOF

          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path("src/phase4-public-flow.test.ts")
          text = p.read_text()
          text = re.sub(
              r'  it\("keeps the exact pinned Launch UI homepage at the public root", \(\) => \{.*?\n  \}\)',
              '''  it("keeps the live Launch UI homepage snapshot at the public root", () => {
                expect(home).toContain('src="/launch-ui-live/index.html"')
                const source = fs.readFileSync(new URL("../public/launch-ui-live/live-source.html", import.meta.url), "utf8")
                expect(source).toContain("Give your big idea the design it deserves")
                expect(source).toContain("It's all about design quality")
              })''',
              text,
              count=1,
              flags=re.S,
          )
          p.write_text(text)
          PY

      - name: Verify WebCanBe app and live landing snapshot
        run: |
          npm ci
          npm run build
          npx vitest run src/phase3-landing.test.ts src/phase4-public-flow.test.ts src/phase4-ux-foundation.test.ts

      - name: Commit live Launch UI homepage mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/mirror-live-launch-ui.yml
          git add -A
          git commit -m "Mirror live Launch UI homepage unchanged"
          git push origin HEAD:phase-4-product-ux
