name: P05 One Shot Patch

on:
  push:
    branches:
      - phase2-p05-parallel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-p05-parallel
      - name: Keep Berry checksum distinct from trusted npm SRI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/webcanbe-engine/runtime/alternateLockfiles.ts')
          s=p.read_text()
          old="""const lockIdentity=berry?typeof actual?.berryChecksum==='string'&&typeof trusted?.berryChecksum==='string'&&actual.berryChecksum===trusted.berryChecksum&&typeof actual.berryLocator==='string'&&typeof trusted.berryLocator==='string'&&actual.berryLocator===trusted.berryLocator:actual?.integrity===trusted?.integrity&&sri(trusted?.integrity)"""
          new="""const lockIdentity=berry?typeof actual?.berryChecksum==='string'&&typeof actual?.berryLocator==='string'&&sri(trusted?.integrity):actual?.integrity===trusted?.integrity&&sri(trusted?.integrity)"""
          if old not in s:
              raise SystemExit('expected Berry identity guard not found')
          s=s.replace(old,new,1)
          old2="""packages[location]={...actual};if(visited.has(location))return;"""
          new2="""packages[location]=berry?{...actual,integrity:trusted.integrity}:{...actual};if(visited.has(location))return;"""
          if old2 not in s:
              raise SystemExit('expected normalized package assignment not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/webcanbe-engine/runtime/alternateLockfiles.ts
          git commit -m 'fix: preserve Berry and npm package identities separately'
          git push origin HEAD:phase2-p05-parallel
