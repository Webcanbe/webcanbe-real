name: P05 One Shot Patch

on:
  push:
    branches:
      - phase2-p05-parallel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-p05-parallel
      - name: Admit ordinary ./ bin metadata without making it executable
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/webcanbe-engine/runtime/alternateLockfiles.ts')
          s=p.read_text()
          old="""if(group==='bin'&&(key.length>128||value===undefined||typeof value!=='string'||value.length>512||value.startsWith('/')||value.includes('\\\\')||value.split('/').some(p=>!p||p==='.'||p==='..')))throw Error('Invalid inert Yarn bin metadata.')"""
          new="""if(group==='bin'){\n        const binPath=typeof value==='string'?value.replace(/^\\.\\//,''):''\n        if(key.length>128||typeof value!=='string'||value.length>512||!binPath||binPath.startsWith('/')||binPath.includes('\\\\')||binPath.split('/').some(p=>!p||p==='.'||p==='..'))throw Error('Invalid inert Yarn bin metadata.')\n      }"""
          if old not in s:
              raise SystemExit('expected Berry bin guard not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/webcanbe-engine/runtime/alternateLockfiles.ts
          git commit -m 'fix: admit inert relative Berry bin paths'
          git push origin HEAD:phase2-p05-parallel
