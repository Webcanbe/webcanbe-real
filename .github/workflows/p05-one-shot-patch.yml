name: P05 One Shot Patch

on:
  push:
    branches:
      - phase2-p05-parallel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-p05-parallel
      - name: Preserve Yarn peer metadata without inventing a peer edge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/webcanbe-engine/runtime/alternateLockfiles.ts')
          s=p.read_text()
          old="""    for(const [name,meta]of Object.entries(record.peerDependenciesMeta)){if(!object(meta)||!Object.prototype.hasOwnProperty.call(record.peerDependencies,name))throw Error('Dangling Yarn Berry peer metadata.')}\n"""
          new="""    for(const meta of Object.values(record.peerDependenciesMeta))if(!object(meta))throw Error('Invalid Yarn Berry peer metadata.')\n"""
          if old not in s:
              raise SystemExit('expected peer metadata guard not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/webcanbe-engine/runtime/alternateLockfiles.ts
          git commit -m 'fix: preserve inert Berry peer metadata without fake edges'
          git push origin HEAD:phase2-p05-parallel
