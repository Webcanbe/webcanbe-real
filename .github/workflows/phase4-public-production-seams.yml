name: Phase 4 public production seams
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Apply production seam correction
        run: python scripts/phase4-public-production-seams.py
      - run: git diff --check
      - name: Phase 4 focused tests
        run: npx vitest run src/phase3-landing.test.ts src/phase4-ux-foundation.test.ts src/phase4-product-hub.test.ts src/phase4-operations.test.ts src/phase4-public-flow.test.ts src/phase4-public-production.test.ts
      - name: Existing hosted auth/product/server tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(grep -RIlE 'HostedLoginBoundary|/__webcanbe/auth/callback|HostedProductController|hostedEditorServer' src --include='*.test.ts' | sort -u)
          printf 'Relevant existing tests:\n%s\n' "${tests[*]:-none}"
          if [ "${#tests[@]}" -gt 0 ]; then npx vitest run "${tests[@]}"; fi
      - name: Production build
        run: npm run build
      - name: Verify frozen branches
        run: |
          test "$(git ls-remote origin refs/heads/phase-3-hosted-product | cut -f1)" = "5d3aa70dfd42e5706a23bd881e97e46665948a30"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "dd2d9cf8ffa6d82e4fdbb3e0ab37fa43ea9f945b"
      - name: Publish production seam correction
        run: |
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase4-public-production-seams.yml scripts/phase4-public-production-seams.py
          git add src/App.tsx src/hostedProductClient.ts src/phase4-public-flow.css src/phase4-public-production.test.ts src/webcanbe-engine/runtime/hostedProductController.ts src/webcanbe-engine/runtime/hostedIdentity.ts src/webcanbe-engine/runtime/hostedEditorServer.ts
          git commit -m "Finish Phase 4 public auth production seams"
          git push origin HEAD:phase-4-product-ux
