name: Phase 4 product hub
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Apply Phase 4 product hub pass
        run: python scripts/phase4-product-hub.py
      - run: git diff --check
      - name: Focused Phase 4 tests
        run: npx vitest run src/phase3-landing.test.ts src/phase4-ux-foundation.test.ts src/phase4-product-hub.test.ts
      - name: Production build
        run: npm run build
      - name: Verify prior phases unchanged
        run: |
          test "$(git ls-remote origin refs/heads/phase-3-hosted-product | cut -f1)" = "5d3aa70dfd42e5706a23bd881e97e46665948a30"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "dd2d9cf8ffa6d82e4fdbb3e0ab37fa43ea9f945b"
      - name: Publish Phase 4 product hub pass
        run: |
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase4-product-hub.yml scripts/phase4-product-hub.py
          git add src/App.tsx src/main.tsx src/phase4-product-hub.css src/phase4-product-hub.test.ts src/webcanbe-engine/visual-editor/CompatibleWorkspace.tsx src/webcanbe-engine/visual-editor/CodeWorkspace.tsx
          git commit -m "Build Phase 4 product hub and split workspace"
          git push origin HEAD:phase-4-product-ux
