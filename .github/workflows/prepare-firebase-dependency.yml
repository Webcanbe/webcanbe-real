name: Prepare Firebase dependency
on:
  push:
    branches: [phase5-firebase-auth]
    paths:
      - .github/workflows/prepare-firebase-dependency.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-firebase-auth
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm install firebase@12.19.0 --save
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Add Firebase web SDK"
          git push origin HEAD:phase5-firebase-auth
