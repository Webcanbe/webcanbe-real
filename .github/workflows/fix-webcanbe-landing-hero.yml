name: Fix WebCanBe landing hero visibility
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Restore mounted visual state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("public/wcb-landing/index.html")
          html = p.read_text(encoding="utf-8")

          # Launch UI's client runtime normally adds this class after hydration.
          # The local static copy intentionally has no foreign runtime, so mark it
          # mounted at rest to release all animate-appear opacity states.
          if re.search(r'<html\\b[^>]*\\bclass=', html):
              html = re.sub(
                  r'(<html\\b[^>]*\\bclass=")([^"]*)(")',
                  lambda m: m.group(1) + (m.group(2) + " mounted" if "mounted" not in m.group(2).split() else m.group(2)) + m.group(3),
                  html,
                  count=1,
              )
          else:
              html = html.replace("<html ", '<html class="mounted" ', 1)

          # Remove the empty floating configurator shell left after its controls were removed.
          html = re.sub(
              r'<nav class="[^"]*fixed bottom-3 left-1/2 z-50[^"]*">\\s*</nav>',
              "",
              html,
              count=1,
          )

          if "mounted" not in html:
              raise SystemExit("mounted state not applied")
          if "Edit visually. Leave with real code you own." not in html:
              raise SystemExit("hero copy missing")
          if 'class="hero-variants"' not in html:
              raise SystemExit("hero shell missing")

          p.write_text(html, encoding="utf-8")
          PY

          cat > src/phase4-landing-hero.test.ts <<'EOF'
          import fs from "node:fs"
          import { describe, expect, it } from "vitest"

          describe("Phase 4 landing hero visibility", () => {
            it("renders the Launch UI animation shell in its mounted state", () => {
              const html = fs.readFileSync("public/wcb-landing/index.html", "utf8")
              expect(html).toContain("mounted")
              expect(html).toContain("Edit visually. Leave with real code you own.")
              expect(html).toContain('class="hero-variants"')
            })
          })
          EOF

      - name: Verify hero and app build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx vitest run src/phase4-landing-hero.test.ts src/phase4-landing-webcanbe.test.ts src/phase4-public-flow.test.ts
          npm run build

      - name: Commit hero visibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-webcanbe-landing-hero.yml
          git add public/wcb-landing/index.html public/wcb-landing/copy.txt src/phase4-landing-hero.test.ts
          git commit -m "Fix WebCanBe landing hero visibility"
          git push origin HEAD:phase-4-product-ux
