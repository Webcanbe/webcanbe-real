name: Port exact Launch UI homepage
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Port pinned Launch UI homepage
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA="b0d4d5bce91d13523450416ce1797109076b2787"
          rm -rf /tmp/launch-ui
          git init -q /tmp/launch-ui
          git -C /tmp/launch-ui remote add origin https://github.com/launch-ui/launch-ui.git
          git -C /tmp/launch-ui fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C /tmp/launch-ui checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/launch-ui rev-parse HEAD)" = "$UPSTREAM_SHA"

          rm -rf src/launch-ui
          mkdir -p src/launch-ui/app src/launch-ui/lib src/launch-ui/shims
          cp -R /tmp/launch-ui/components src/launch-ui/components
          cp -R /tmp/launch-ui/config src/launch-ui/config
          cp -R /tmp/launch-ui/styles src/launch-ui/styles
          cp /tmp/launch-ui/app/page.tsx src/launch-ui/app/page.tsx
          cp /tmp/launch-ui/app/globals.css src/launch-ui/app/globals.css
          cp /tmp/launch-ui/lib/utils.ts src/launch-ui/lib/utils.ts
          cp /tmp/launch-ui/LICENSE.md src/launch-ui/LICENSE.md
          cp /tmp/launch-ui/public/dashboard-light.png public/dashboard-light.png
          cp /tmp/launch-ui/public/dashboard-dark.png public/dashboard-dark.png

          cat > src/launch-ui/SOURCE.md <<'EOF'
          # Launch UI source
          Upstream: https://github.com/launch-ui/launch-ui
          Commit: b0d4d5bce91d13523450416ce1797109076b2787
          License: MIT (see LICENSE.md)

          The landing page source is copied from the upstream homepage composition:
          Navbar → Hero → Logos → Items → Stats → Pricing → FAQ → CTA → Footer.

          Only framework-compatibility adapters required to render the upstream Next.js components inside the existing WebCanBe Vite shell are local.
          EOF

          cat > src/launch-ui/shims/next-link.tsx <<'EOF'
          import type { AnchorHTMLAttributes, ReactNode } from "react"

          export type LinkProps = AnchorHTMLAttributes<HTMLAnchorElement> & {
            href: string | URL
            children?: ReactNode
          }

          export default function Link({ href, children, ...props }: LinkProps) {
            return <a href={String(href)} {...props}>{children}</a>
          }
          EOF

          cat > src/launch-ui/shims/next-image.tsx <<'EOF'
          import type { ImgHTMLAttributes } from "react"

          export type ImageProps = Omit<ImgHTMLAttributes<HTMLImageElement>, "src"> & {
            src: string | { src: string }
            unoptimized?: boolean
            priority?: boolean
          }

          export default function Image({ src, unoptimized: _unoptimized, priority: _priority, ...props }: ImageProps) {
            return <img src={typeof src === "string" ? src : src.src} {...props} />
          }
          EOF

          cat > src/Home.tsx <<'EOF'
          import LaunchUIHome from "./launch-ui/app/page"
          import "./launch-ui/app/globals.css"

          export default function Home() {
            return (
              <div className="launch-ui-page dark" style={{ colorScheme: "dark" }}>
                <LaunchUIHome />
              </div>
            )
          }
          EOF

          python3 <<'PY'
          from pathlib import Path
          import json, re

          css_path = Path("src/launch-ui/app/globals.css")
          css = css_path.read_text()
          css = css.replace(
              '@import "tailwindcss";',
              '@import "tailwindcss/theme.css" layer(theme);\n@import "tailwindcss/utilities.css" layer(utilities);',
              1,
          )
          css = css.replace(":root {", ".launch-ui-page {", 1)
          css = css.replace("\n.dark {", "\n.dark .launch-ui-page {", 1)
          css = re.sub(
              r'@layer base \{\s*\* \{\s*@apply border-border;\s*\}\s*body \{\s*@apply bg-background text-foreground;\s*\}\s*\}',
              '@layer base {\n  .launch-ui-page, .launch-ui-page * { @apply border-border; }\n  .launch-ui-page { @apply bg-background text-foreground; font-family: Inter, ui-sans-serif, system-ui, sans-serif; min-height: 100vh; }\n}',
              css,
              count=1,
              flags=re.S,
          )
          css_path.write_text(css)

          ts = json.loads(Path("tsconfig.json").read_text())
          co = ts.setdefault("compilerOptions", {})
          co["baseUrl"] = "."
          co["paths"] = {
              "@/*": ["src/launch-ui/*"],
              "next/link": ["src/launch-ui/shims/next-link.tsx"],
              "next/image": ["src/launch-ui/shims/next-image.tsx"],
          }
          Path("tsconfig.json").write_text(json.dumps(ts, indent=2) + "\n")

          vite_path = Path("vite.config.ts")
          vite = vite_path.read_text()
          if 'fileURLToPath' not in vite:
              vite = 'import { fileURLToPath, URL } from "node:url"\n' + vite
          old = '  // Project previews run only inside opaque-origin sandboxed frames.\n  server:'
          new = '''  resolve: {
            alias: {
              "@": fileURLToPath(new URL("./src/launch-ui", import.meta.url)),
              "next/link": fileURLToPath(new URL("./src/launch-ui/shims/next-link.tsx", import.meta.url)),
              "next/image": fileURLToPath(new URL("./src/launch-ui/shims/next-image.tsx", import.meta.url)),
            },
          },
          // Project previews run only inside opaque-origin sandboxed frames.
          server:'''
          if old not in vite:
              raise SystemExit("vite insertion anchor not found")
          vite = vite.replace(old, new, 1)
          vite_path.write_text(vite)

          Path("src/phase3-landing.test.ts").write_text(r'''import fs from "node:fs"
          import { describe, expect, it } from "vitest"

          describe("Phase 4 exact Launch UI landing composition", () => {
            it("ports the pinned upstream homepage composition without WebCanBe redesign", () => {
              const home = fs.readFileSync("src/Home.tsx", "utf8")
              const page = fs.readFileSync("src/launch-ui/app/page.tsx", "utf8")
              const source = fs.readFileSync("src/launch-ui/SOURCE.md", "utf8")
              const app = fs.readFileSync("src/App.tsx", "utf8")
              const order = ["<Navbar />", "<Hero />", "<Logos />", "<Items />", "<Stats />", "<Pricing />", "<FAQ />", "<CTA />", "<Footer />"]
              let cursor = -1
              for (const marker of order) {
                const next = page.indexOf(marker, cursor + 1)
                expect(next, marker).toBeGreaterThan(cursor)
                cursor = next
              }
              expect(home).toContain('LaunchUIHome')
              expect(home).toContain('className="launch-ui-page dark"')
              expect(source).toContain("b0d4d5bce91d13523450416ce1797109076b2787")
              expect(fs.existsSync("public/dashboard-light.png")).toBe(true)
              expect(fs.existsSync("public/dashboard-dark.png")).toBe(true)
              for (const productRoute of ["/browse", "/project/", "/login", "/signup", "/workspace/", "/projects", "/dashboard", "/settings", "/plans", "/seller"]) expect(app).toContain(productRoute)
            })
          })
          ''')

          p = Path("src/phase4-public-flow.test.ts")
          text = p.read_text()
          text = re.sub(
              r'  it\("keeps the Launch UI landing composition and bounded transition behavior", \(\) => \{.*?\n  \}\)',
              '''  it("keeps the exact pinned Launch UI homepage at the public root", () => {
                const page = fs.readFileSync(new URL("./launch-ui/app/page.tsx", import.meta.url), "utf8")
                for (const marker of ["<Navbar />", "<Hero />", "<Logos />", "<Items />", "<Stats />", "<Pricing />", "<FAQ />", "<CTA />", "<Footer />"]) expect(page).toContain(marker)
                expect(home).toContain('LaunchUIHome')
                expect(home).toContain('launch-ui-page dark')
              })''',
              text,
              count=1,
              flags=re.S,
          )
          p.write_text(text)
          PY

          npm install --save             @radix-ui/react-accordion@^1.2.20             @radix-ui/react-dialog@^1.1.23             @radix-ui/react-dropdown-menu@^2.1.24             @radix-ui/react-icons@^1.3.2             @radix-ui/react-navigation-menu@^1.2.22             @radix-ui/react-slot@^1.3.3             class-variance-authority@^0.7.1             clsx@^2.1.1             lucide-react@^0.468.0             next-themes@^0.4.6             tailwind-merge@^3.6.0             tw-animate-css@^1.4.0

      - name: Verify exact landing port
        run: |
          npm run build
          npx vitest run src/phase3-landing.test.ts src/phase4-public-flow.test.ts src/phase4-ux-foundation.test.ts

      - name: Commit exact Launch UI homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/port-exact-launch-ui.yml
          git add src/Home.tsx src/launch-ui src/phase3-landing.test.ts src/phase4-public-flow.test.ts public/dashboard-light.png public/dashboard-dark.png package.json package-lock.json tsconfig.json vite.config.ts
          git commit -m "Port exact Launch UI homepage"
          git push origin HEAD:phase-4-product-ux
