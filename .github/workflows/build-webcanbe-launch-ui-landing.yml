              "The basic version of Launch UI is open-source and free forever, under a do-whatever-you-want license.": "Yes. Export is part of the product contract and the project remains portable.",
              "The pro version that contains more components and options is a one-time purchase that gives you lifetime access to all current and future content. Use it for unlimited personal and commercial projects - no recurring fees or restrictions.": "Your exported project is meant to continue as a normal codebase outside WebCanBe.",
