name: Build WebCanBe Launch UI landing
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Build editable WebCanBe landing from Launch UI structure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install beautifulsoup4 requests
          rm -rf public/wcb-landing
          mkdir -p public/wcb-landing

          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup, NavigableString

          ORIGIN = "https://www.launchuicomponents.com/"
          html = requests.get(
              ORIGIN,
              timeout=45,
              headers={"User-Agent": "Mozilla/5.0"},
          ).text
          if "Give your big idea the design it deserves" not in html:
              raise SystemExit("Launch UI homepage signature changed; refusing to generate stale landing.")

          soup = BeautifulSoup(html, "html.parser")

          # Static, editable copy: keep the rendered markup and original visual assets,
          # but remove the foreign Next.js runtime so it cannot hydrate back to Launch UI copy.
          for tag in list(soup.find_all("script")):
              tag.decompose()
          for tag in list(soup.find_all("link")):
              rel = [str(x).lower() for x in (tag.get("rel") or [])]
              if "modulepreload" in rel or ("preload" in rel and tag.get("as") == "script"):
                  tag.decompose()

          # Point visual dependencies at the original immutable CDN/site assets.
          for tag in soup.find_all(True):
              for attr in ("src", "poster"):
                  value = tag.get(attr)
                  if isinstance(value, str) and value.startswith("/"):
                      tag[attr] = urljoin(ORIGIN, value)
              srcset = tag.get("srcset")
              if isinstance(srcset, str):
                  parts = []
                  for part in srcset.split(","):
                      piece = part.strip().split(" ", 1)
                      if piece and piece[0].startswith("/"):
                          piece[0] = urljoin(ORIGIN, piece[0])
                      parts.append(" ".join(piece))
                  tag["srcset"] = ", ".join(parts)
              if tag.name == "link":
                  href = tag.get("href")
                  if isinstance(href, str) and href.startswith("/"):
                      tag["href"] = urljoin(ORIGIN, href)

          # Remove top GitHub/X controls and the prior top-nav Pricing entry.
          footer = soup.find("footer")
          for a in list(soup.find_all("a", href=True)):
              href = a.get("href", "").lower()
              label = " ".join(a.stripped_strings).strip().lower()
              inside_footer = footer is not None and footer in a.parents
              if not inside_footer and ("github.com/launch-ui" in href or "twitter.com/mikolajdobrucki" in href or "x.com/mikolajdobrucki" in href):
                  # The hero GitHub CTA becomes a WebCanBe account CTA; compact social icons disappear.
                  classes = set(a.get("class") or [])
                  if "size-9" in classes or label in {"twitter", "x"}:
                      a.decompose()
                  else:
                      a["href"] = "/signup"
                      a["target"] = "_top"
                      a.clear()
                      a.append("Create account")
              elif not inside_footer and label == "pricing":
                  a.decompose()

          # Remove the full Preview/Color theme/Radius/Appearance/Lines/Shuffle configurator.
          for panel in list(soup.find_all("div")):
              body = " ".join(panel.stripped_strings)
              classes = set(panel.get("class") or [])
              if {"flex", "grow", "justify-start", "gap-3"}.issubset(classes) and "Color theme" in body and "Border radius" in body and "Shuffle" in body:
                  panel.decompose()
                  break

          # Remove bottom theme/settings control from the footer.
          if footer:
              for button in list(footer.find_all("button")):
                  if "theme" in " ".join(button.stripped_strings).lower():
                      button.decompose()

          # Remove Launch UI-only social-proof and commercial pricing sections rather than
          # inventing testimonials or claiming an active payment product.
          for section in list(soup.find_all("section")):
              body = " ".join(section.stripped_strings)
              if "Loved by designers and developers across the planet" in body:
                  section.decompose()
                  continue
              if "These are some dummy testimonials" in body:
                  section.decompose()
                  continue
              if ("Pro Team" in body and "one-time payment" in body) or ("$499" in body and "Get all-access for your team" in body):
                  section.decompose()
                  continue
              if ("designers on Figma Community" in body and "installations with shadcn/ui CLI" in body) or ("used by 54.4" in body and "Figma Community" in body):
                  section.decompose()
                  continue

          # Remove social-proof gallery cards that still contain dummy people.
          for card in list(soup.find_all(attrs={"data-slot": "gallery-item"})):
              body = " ".join(card.stripped_strings)
              if any(name in body for name in ("Marcin Zaremski", "Marcus Rodriguez", "Darius Flynn", "Fabrizio Fernandez")):
                  card.decompose()

          copy = {
              "Launch UI v2 is out!": "The source is the product.",
              "Launch UI v2.10.1": "WebCanBe",
              "Start building top quality designs yourself": "Build from real projects, not a blank canvas.",
              "Check out my free course designwithcode.dev": "Explore the marketplace",
              "Used by 54.4k+ companies and builders": "Source-owned projects • Visual + Code",
              "Read more": "Explore projects",
              "New version of Launch UI is out!": "WebCanBe",
              "Give your big idea the design it deserves": "Edit visually. Leave with real code you own.",
              "Professionally designed blocks and templates built with React, Shadcn/ui and Tailwind that will help your product stand out.": "Start from working web projects, edit the real source visually or in code, and take the codebase with you.",
              "Free and open source forever.": "Your working project stays real source code.",
              "Last updated: 4 Sep 2026": "Source-first by design",
              "Built with industry-standard tools and best practices": "Built around real source, not a proprietary canvas",
              "Trusted by world's leading companies": "One source across the whole workflow",
              "AxionLabs": "Marketplace",
              "Synthetikai": "Release",
              "Driftbase": "Visual",
              "Flowrate": "Code",
              "Quantify": "History",
              "Orbitra": "Export",
              "It's all about design quality": "The source is the product",
              "In a world where everybody can vibe-code a new thing overnight, the key is to stand out. Generic-looking shadcn/ui blocks won't help you to get noticed. With Launch UI, you can make sure that your design is unique and memorable.": "WebCanBe keeps marketplace releases, visual editing, code editing, history, and export attached to the same real project source.",
              "Design-first": "Visual when you want it",
              "Each block and component is carfully crafted—not generated by AI—to give a unique look and feel AI would never come up with.": "Change the interface visually when that is the fastest way to work, without creating a second source of truth.",
              "Made for fast development": "Code when you need it",
              "With lightweight code, modern tooling and best practice, Launch UI is as fast in the browser as it is to build with.": "Open the actual source when precision matters. Visual and Code operate on the same working project.",
              "The code is yours": "Own the project",
              "With Launch UI, the code is yours forever. Never bother about subscriptions and lock-ins.": "Your working copy remains normal source code you can export and keep using outside WebCanBe.",
              "With Launch UI, the code is yours forever. You can use it as a starting point for your own projects and customize it to your needs.": "Your working copy remains normal source code. Edit it here, export it, and continue in your own development workflow.",
              "Never bother about subscriptions and lock-ins.": "Keep the codebase portable outside WebCanBe.",
              "Top-level performance": "Browser-native workflow",
              "Made for static sites while avoiding heavy assets, your website will feel snappy and load instantly.": "Work in the browser without turning your project into a proprietary design document.",
              "Lightweight and optimized, your website will will feel snappy and load instantly.": "Use the browser workspace while the project source remains authoritative.",
              "With no heavy assets or dependencies, your website will feel snappy and load instantly.": "The editor works around your real project instead of replacing it with another format.",
              "No bloat, no extra maintenance.": "No second source of truth.",
              "Data-agnostic": "One canonical source",
              "All the data is separate from components so you can edit it in seconds or make it dynamic.": "Visual, Code, and future AI edits resolve against the same working source and revision.",
              "Easily connect to a CMS of your choice.": "Keep using the tools your project already uses.",
