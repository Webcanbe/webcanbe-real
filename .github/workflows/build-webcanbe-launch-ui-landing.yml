              "For complete details about licensing and usage rights, check out the pricing page": "Ownership should not depend on keeping WebCanBe in your runtime.",
              "Blocks, components and templates for building websites, landing pages and apps. Made with React, Shadcn/ui and Tailwind. Perfect for early-stage product, startups, indie hackers, and personal projects.": "A source-first marketplace and browser workspace for real web projects. Edit visually, edit code, keep history, and export what you own.",
              "© 2026 mikolajdobrucki. All rights reserved": "© 2026 WebCanBe. All rights reserved",
              "Start building": "Start from real code",
              "Start building with Launch UI": "Start building with WebCanBe",
              "Get started with Launch UI and build your landing page in no time": "Browse working projects and keep building from source you own.",
              "Get started with Launch UI and build your landing page in no time.": "Browse working projects and keep building from source you own.",
              "Ready to elevate your design?": "Ready to build without giving up the source?",
              "View Pricing": "View plans",
              "Product": "Product",
              "Changelog": "Changelog",
              "Documentation": "Documentation",
              "Company": "Company",
              "About": "About",
              "Careers": "Creator Studio",
              "Blog": "Updates",
              "Contact": "Contact",
              "Discord": "Email",
              "Twitter": "X",
              "© 2026 Mikołaj Dobrucki. All rights reserved": "© 2026 WebCanBe. All rights reserved",
          }

          for node in list(soup.find_all(string=True)):
              if not isinstance(node, NavigableString):
                  continue
              parent = node.parent
              if parent and parent.name in {"style", "script"}:
                  continue
              value = str(node)
              stripped = value.strip()
              if not stripped:
                  continue
              replacement = copy.get(stripped)
              if replacement is not None:
                  prefix = value[:len(value)-len(value.lstrip())]
                  suffix = value[len(value.rstrip()):]
                  node.replace_with(prefix + replacement + suffix)

          # Any remaining visible Launch UI brand copy becomes WebCanBe; external asset
          # URLs remain untouched because this only changes text nodes.
          for node in list(soup.find_all(string=True)):
              if not isinstance(node, NavigableString):
                  continue
              parent = node.parent
              if parent and parent.name in {"style", "script"}:
                  continue
              value = str(node)
              updated = value.replace("Launch UI", "WebCanBe").replace("@launchui", "@webcanbe").replace("mikolajdobrucki", "WebCanBe")
              if updated != value:
                  node.replace_with(updated)

          # Main navigation: find the compact navigation shell even when the live page does not use <header>.
          header = soup.find("header")
          if header is None:
              candidates = []
              for candidate in soup.find_all(["nav", "div"]):
                  body = " ".join(candidate.stripped_strings)
                  if "Docs" in body and "Components" in body and len(body) < 700:
                      candidates.append(candidate)
              header = min(candidates, key=lambda x: len(" ".join(x.stripped_strings)), default=None)
          if header:
              nav_map = {
                  "Documentation": ("How it works", "#about"),
                  "Docs": ("How it works", "#about"),
                  "Blocks": ("Workspace", "#features"),
                  "Components": ("Workspace", "#features"),
                  "Illustrations": ("Marketplace", "/browse"),
                  "Working Projects": ("Marketplace", "/browse"),
                  "Templates": ("Marketplace", "/browse"),
                  "Creator Studio": ("Creator Studio", "/seller"),
                  "Get Started": ("Browse projects", "/browse"),
                  "Get started": ("Browse projects", "/browse"),
                  "WebCanBe v2.10.1": ("WebCanBe", "/"),
              }
              for a in list(header.find_all("a")):
                  label = " ".join(a.stripped_strings).strip()
                  if label in nav_map:
                      new_label, href = nav_map[label]
                      a.clear()
                      a.append(new_label)
                      a["href"] = href
                      if href.startswith("/"):
                          a["target"] = "_top"

          # Repoint any remaining Launch UI commercial/docs URLs before handling CTA labels.
          for a in list(soup.find_all("a", href=True)):
              href = a.get("href", "")
              low = href.lower()
              if "twitter.com/mikolajdobrucki" in low or "x.com/mikolajdobrucki" in low:
                  a.decompose()
                  continue
              if "github.com/launch-ui/launch-ui" in low:
                  if footer is not None and footer in a.parents:
                      a["href"] = "https://github.com/Webcanbe/webcanbe-real"
                      a["target"] = "_blank"
                      a["rel"] = "noreferrer"
                  else:
                      a["href"] = "/signup"
                      a["target"] = "_top"
                      a.clear()
                      a.append("Create account")
                  continue
              if "launchui.lemonsqueezy.com" in low or "/pricing" in low:
                  a["href"] = "/plans"
                  a["target"] = "_top"
                  continue
              if "launchuicomponents.com" in low:
                  if "/docs" in low:
                      a["href"] = "https://github.com/Webcanbe/webcanbe-real#readme"
                      a["target"] = "_blank"
                      a["rel"] = "noreferrer"
                  elif any(part in low for part in ("/templates", "/blocks", "/illustrations")):
                      a["href"] = "/browse"
                      a["target"] = "_top"
                  else:
                      a["href"] = "/"
                      a["target"] = "_top"
              elif "designwithcode.dev" in low:
                  a["href"] = "/browse"
                  a["target"] = "_top"

          # Hero/CTA action links.
          for a in soup.find_all("a"):
              label = " ".join(a.stripped_strings).strip()
              if label in {"Browse projects", "Get Started", "Get started"}:
                  a["href"] = "/browse"
                  a["target"] = "_top"
              elif label in {"View project", "View Template"}:
                  a["href"] = "/browse"
                  a["target"] = "_top"
              elif label == "View plans":
                  a["href"] = "/plans"
                  a["target"] = "_top"

          # Mark sections used by top nav.
          for section in soup.find_all("section"):
              body = " ".join(section.stripped_strings)
              if "The source is the product" in body and not section.get("id"):
                  section["id"] = "about"
                  break
          for section in soup.find_all("section"):
              body = " ".join(section.stripped_strings)
              if "Everything edits the same source." in body and not section.get("id"):
                  section["id"] = "features"
                  break

          # Footer structure stays, but its links become WebCanBe links.
          footer = soup.find("footer")
          if footer:
              doc_link = next((a for a in footer.find_all("a") if " ".join(a.stripped_strings).strip() == "Documentation"), None)
              if doc_link is not None and not any(" ".join(a.stripped_strings).strip() == "Changelog" for a in footer.find_all("a")):
                  changelog = soup.new_tag("a", href="https://github.com/Webcanbe/webcanbe-real/commits/phase-4-product-ux/")
                  if doc_link.get("class"):
                      changelog["class"] = list(doc_link.get("class"))
                  changelog["target"] = "_blank"
                  changelog["rel"] = "noreferrer"
                  changelog.string = "Changelog"
                  doc_link.insert_after(changelog)
              for a in list(footer.find_all("a")):
                  label = " ".join(a.stripped_strings).strip()
                  if label == "Documentation":
                      a["href"] = "https://github.com/Webcanbe/webcanbe-real#readme"
                      a["target"] = "_blank"
                      a["rel"] = "noreferrer"
                  elif label == "Changelog":
                      a["href"] = "https://github.com/Webcanbe/webcanbe-real/commits/phase-4-product-ux/"
                      a["target"] = "_blank"
                      a["rel"] = "noreferrer"
                  elif label.lower() == "github":
                      a["href"] = "https://github.com/Webcanbe/webcanbe-real"
                      a["target"] = "_blank"
                      a["rel"] = "noreferrer"
                  elif label == "Email":
                      a["href"] = "mailto:hello@webcanbe.com"
                  elif label == "Creator Studio":
                      a["href"] = "/seller"
                      a["target"] = "_top"
                  elif label == "Updates":
                      a["href"] = "https://github.com/Webcanbe/webcanbe-real/commits/phase-4-product-ux/"
                      a["target"] = "_blank"
                      a["rel"] = "noreferrer"
                  elif label == "About":
                      a["href"] = "#about"
                  elif label == "X":
                      a.decompose()
                  elif label in {"Privacy Policy", "Terms of Service"}:
                      a.attrs.pop("href", None)

          # Rebrand metadata.
          if soup.title:
              soup.title.string = "WebCanBe"
          for meta in soup.find_all("meta"):
              if meta.get("name") == "description" or meta.get("property") in {"og:title", "og:description", "og:site_name", "twitter:title", "twitter:description"}:
                  key = meta.get("name") or meta.get("property")
                  if key in {"og:title", "og:site_name", "twitter:title"}:
                      meta["content"] = "WebCanBe"
                  else:
                      meta["content"] = "Edit visually. Leave with real code you own."

          # Brand only: preserve Launch UI layout and surface treatment.
          style = soup.new_tag("style", id="wcb-brand-overrides")
          style.string = """
          :root,.dark {
            --brand:#5b5cf0 !important;
            --brand-foreground:#8f90ff !important;
            --primary:#5b5cf0 !important;
            --ring:#5b5cf0 !important;
            --light:#5b5cf0 !important;
            --light-foreground:#a9aaff !important;
          }
          ::selection { background:#7778ff; color:#fff; }
          """
          soup.head.append(style)

          # Internal app links must escape the iframe.
          for a in soup.find_all("a", href=True):
              href = a["href"]
              if isinstance(href, str) and href.startswith("/") and not href.startswith("//"):
                  a["target"] = "_top"

          # Final truth checks.
          visible = " ".join(soup.stripped_strings)
          if "Launch UI" in visible or "@launchui" in visible or "Mikołaj Dobrucki" in visible:
              raise SystemExit("Old Launch UI visible copy remains after WebCanBe rewrite.")
          for forbidden in ("dark theme", "color theme", "border radius", "lines on", "lines off", "shuffle"):
              if forbidden in visible.lower():
                  raise SystemExit(f"Theme/settings control still visible: {forbidden}")
          if header:
              for a in header.find_all("a", href=True):
                  href = a["href"].lower()
                  if "github.com/launch-ui" in href or "twitter.com/mikolajdobrucki" in href:
                      raise SystemExit("Top GitHub/X link still present.")

          out = Path("public/wcb-landing")
          out.mkdir(parents=True, exist_ok=True)
          (out / "index.html").write_text(str(soup), encoding="utf-8")
          (out / "copy.txt").write_text(visible, encoding="utf-8")
          (out / "SOURCE.txt").write_text(
              "Visual structure derived from the Launch UI public homepage.\n"
              "Source reference: https://www.launchuicomponents.com/\n"
              "WebCanBe copy, navigation, brand, and product claims are local.\n",
              encoding="utf-8",
          )
          print("landing_bytes", (out / "index.html").stat().st_size)
          PY

          cat > src/Home.tsx <<'EOF'
          export default function Home() {
            return (
              <iframe
                title="WebCanBe"
                src="/wcb-landing/index.html"
                style={{
                  position: "fixed",
                  inset: 0,
                  width: "100vw",
                  height: "100vh",
                  border: 0,
                  margin: 0,
                  padding: 0,
                  display: "block",
                  background: "#0b0b0d",
                }}
              />
            )
          }
          EOF

          cat > src/phase3-landing.test.ts <<'EOF'
          import fs from "node:fs"
          import { describe, expect, it } from "vitest"

          describe("Phase 4 WebCanBe landing", () => {
            it("uses the local editable landing and preserves product routes", () => {
              const home = fs.readFileSync("src/Home.tsx", "utf8")
              const app = fs.readFileSync("src/App.tsx", "utf8")
              expect(home).toContain('src="/wcb-landing/index.html"')
              expect(home).toContain('title="WebCanBe"')
              for (const route of ["/browse", "/project/", "/login", "/signup", "/workspace/", "/projects", "/dashboard", "/settings", "/plans", "/seller"]) expect(app).toContain(route)
            })
          })
          EOF

          python3 <<'PY2'
          from pathlib import Path
          import re
          p = Path("src/phase4-public-flow.test.ts")
          text = p.read_text()
          text = re.sub(
              r'  it\("keeps the live Launch UI homepage unchanged at the public root", \(\) => \{.*?\n  \}\)',
              '''  it("keeps the local WebCanBe landing at the public root", () => {
                expect(home).toContain('src="/wcb-landing/index.html"')
                expect(home).toContain('title="WebCanBe"')
              })''',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'  it\("keeps the live Launch UI homepage snapshot at the public root", \(\) => \{.*?\n  \}\)',
              '''  it("keeps the local WebCanBe landing at the public root", () => {
                expect(home).toContain('src="/wcb-landing/index.html"')
                expect(home).toContain('title="WebCanBe"')
              })''',
              text,
              count=1,
              flags=re.S,
          )
          p.write_text(text)
          PY2

          cat > src/phase4-landing-webcanbe.test.ts <<'EOF'
          import fs from "node:fs"
          import { describe, expect, it } from "vitest"

          describe("Phase 4 WebCanBe landing copy", () => {
            it("keeps the Launch UI visual shell but owns the visible product copy", () => {
              const home = fs.readFileSync("src/Home.tsx", "utf8")
              const html = fs.readFileSync("public/wcb-landing/index.html", "utf8")
              const copy = fs.readFileSync("public/wcb-landing/copy.txt", "utf8")

              expect(home).toContain('src="/wcb-landing/index.html"')
              expect(copy).toContain("Edit visually. Leave with real code you own.")
              expect(copy).toContain("The source is the product")
              expect(copy).toContain("Documentation")
              expect(copy).toContain("Changelog")
              expect(copy).not.toContain("Launch UI")
              expect(copy).not.toContain("Mikołaj Dobrucki")
              expect(copy.toLowerCase()).not.toContain("dark theme")
              expect(copy.toLowerCase()).not.toContain("color theme")
              expect(copy.toLowerCase()).not.toContain("border radius")
              expect(copy.toLowerCase()).not.toContain("shuffle")
              expect(html).toContain("--brand:#5b5cf0")
              expect(html).not.toContain('https://github.com/launch-ui/launch-ui')
              expect(html).not.toContain('https://twitter.com/mikolajdobrucki')
            })
          })
          EOF

      - name: Verify landing and product boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx vitest run             src/phase4-landing-webcanbe.test.ts             src/phase3-landing.test.ts             src/phase4-public-flow.test.ts             src/phase4-brand-auth.test.ts             src/phase4-ux-foundation.test.ts
          npm run build

      - name: Commit WebCanBe landing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/build-webcanbe-launch-ui-landing.yml
          git rm -f .github/workflows/inspect-launch-ui-controls.yml || true
          git add src/Home.tsx src/phase3-landing.test.ts src/phase4-public-flow.test.ts src/phase4-landing-webcanbe.test.ts public/wcb-landing
          git commit -m "Rebrand Launch UI landing for WebCanBe"
          git push origin HEAD:phase-4-product-ux
