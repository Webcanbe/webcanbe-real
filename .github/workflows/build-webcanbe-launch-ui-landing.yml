              "CMS friendly": "Portable source",
              "Built to work with your any headless content management system": "Export the project and continue in your normal development workflow.",
              "Built to work with any headless content management system": "Export the project and continue in your normal development workflow.",
              "Made for search engines": "No proprietary canvas",
              "Unlike the bloated no-code solutions, Launch UI is built to be perfectly optimized for search engines.": "WebCanBe edits real project source instead of converting it into a closed canvas format.",
              "Mobile-first": "Browser workspace",
              "Optimized to look and feel great on all devices, operating systems, and screen sizes.": "Work from a browser workspace on the same underlying project.",
              "Everything you need. Nothing you don't.": "Everything edits the same source.",
              "Everything you need at your fingertips": "Visual and code, side by side.",
              "A comprehensive collection of components written in modern React, Typescript and Tailwind CSS.": "Use Visual, Code, or Split depending on the change you need to make.",
              "You'll find here everything you need to build your next landing page.": "No conversion step and no second source of truth.",
              "You can change anything. But you don't have to.": "Use the workflow that fits the change.",
              "Get the full control of the code of your website. Change it or just use the defaults. Customize it in seconds with CSS variables.": "Make visual changes when they're faster; open the source when precision matters.",
              "What's inside?": "What you can do",
              "Hundreds of components, blocks and templates, all created with React, Shadcn/ui and Tailwind that will help you make your product look special.": "Browse real projects, create an editable copy, work against real source, keep history, and export the code.",
              "Blocks": "Marketplace",
              "Building blocks for creating beautiful user interfaces across various sections of your website.": "Start from versioned working projects instead of static screenshots.",
              "Hero": "Workspace",
              "Bento Grid": "Visual",
              "Feature": "Code",
              "FAQ": "History",
              "Navbar": "Export",
              "Logos": "Releases",
              "Items": "Creator Studio",
              "5 sections": "",
              "6 sections": "",
              "4 sections": "",
              "Website Templates": "Working Projects",
              "Templates": "Working Projects",
              "Complete website templates ready to be customized for your business needs.": "Versioned projects ready to become your editable working copy.",
              "Complete website templates and app interfaces ready to be customized for your business needs.": "Versioned projects and app interfaces ready to become your editable working copy.",
              "Saturn": "Northstar Studio",
              "Jupiter": "Relay",
              "Neptune": "Fieldnotes",
              "Luna": "Morrow",
              "Pluto": "Suite",
              "Calendar": "Brief",
              "Chat": "Workspace",
              "A modern and clean template for SaaS businesses and marketing websites. Designed to showcase your product and convert visitors into customers.": "A considered working project you can inspect, materialize, edit, and export.",
              "A template for groundbreaking AI products and startups.": "A real project release designed to become a source-owned working copy.",
              "View Template": "View project",
              "Recently built with Launch UI": "Explore working projects",
              "Dozens of designers and developers have already built their websites with Launch UI.": "Start from a release, then create your own editable working copy.",
              "Make the right impression": "Start with something real",
              "Launch UI makes it easy to build an unforgetable website that resonates with professional design-centric audiences.": "WebCanBe starts from working projects you can inspect, edit, and export.",
              "Choose your sections": "Choose a project",
              "Choose among 100+ components to build a landing page suited to the needs of your product.": "Browse published releases and choose a working project that fits what you want to build.",
              "Add your content": "Edit visually or in code",
              "Fill the blanks with screenshots, videos, and other content featuring your product.": "Make interface changes visually or open the real source for precise edits.",
