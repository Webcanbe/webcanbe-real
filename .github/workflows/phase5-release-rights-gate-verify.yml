name: Phase 5 release rights gate verify
on:
  push:
    branches: [phase5-release-rights-gate]
  pull_request:
    branches: [main]
    paths:
      - deployment/hosted/postgres.sql
      - deployment/hosted/migrations/202609211920_release_rights_verification.sql
      - worker/control-mutations.js
      - worker/control-read.js
      - worker/index.js
      - worker/readiness.js
      - src/hostedProductClient.ts
      - src/App.tsx
      - src/phase5-release-rights-gate.test.ts
      - src/phase5-bigperson-mutations.test.ts
      - .github/workflows/phase5-release-rights-gate-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare runtime profile
        run: npm run runtime:prepare
      - name: Secret scan
        run: npm run security:secrets
      - name: Rights + privileged authority regressions
        run: npx vitest run src/phase5-release-rights-gate.test.ts src/phase5-bigperson-mutations.test.ts src/phase5-product-operator-schema.test.ts src/phase5-ready-qualification.test.ts
      - name: Worker syntax
        run: node --check worker/control-mutations.js && node --check worker/control-read.js && node --check worker/readiness.js && node --check worker/index.js
      - name: Production build
        run: npm run build
      - name: Production build budget
        run: node scripts/launch/build-budget.mjs
      - name: Worker bundle dry run
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
