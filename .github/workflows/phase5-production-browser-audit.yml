name: Phase 5 production browser audit
on:
  push:
    branches: [phase5-production-browser-audit]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install Lighthouse
        run: npm install --no-save --ignore-scripts lighthouse@13
      - name: Audit production routes
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          mkdir -p .lighthouse
          run_lighthouse() {
            local url="$1"
            local output="$2"
            shift 2
            for attempt in 1 2 3; do
              if npx lighthouse "$url" --quiet "$@" --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="$output"; then
                return 0
              fi
              echo "Lighthouse attempt $attempt failed for $url; retrying..."
              sleep 3
            done
            return 1
          }
          for route in root browse login; do
            case "$route" in
              root) url="https://webcanbe.com/" ;;
              browse) url="https://webcanbe.com/browse" ;;
              login) url="https://webcanbe.com/login" ;;
            esac
            run_lighthouse "$url" ".lighthouse/${route}-mobile.json"
            run_lighthouse "$url" ".lighthouse/${route}-desktop.json" --preset=desktop
          done
      - name: Print audit summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const files = fs.readdirSync('.lighthouse').filter(x => x.endsWith('.json')).sort()
          for (const file of files) {
            const report = JSON.parse(fs.readFileSync('.lighthouse/' + file, 'utf8'))
            const c = report.categories
            const a = report.audits
            const score = key => Math.round((c[key]?.score ?? 0) * 100)
            console.log(JSON.stringify({
              file,
              url: report.finalUrl,
              performance: score('performance'),
              accessibility: score('accessibility'),
              bestPractices: score('best-practices'),
              seo: score('seo'),
              fcpMs: Math.round(a['first-contentful-paint']?.numericValue ?? 0),
              lcpMs: Math.round(a['largest-contentful-paint']?.numericValue ?? 0),
              cls: Number((a['cumulative-layout-shift']?.numericValue ?? 0).toFixed(3)),
              tbtMs: Math.round(a['total-blocking-time']?.numericValue ?? 0),
            }))
            const failingA11y = Object.entries(a)
              .filter(([,audit]) => audit?.scoreDisplayMode === 'binary' && audit?.score === 0 && audit?.details?.type === 'table')
              .filter(([id]) => ['button-name','link-name','image-alt','label','color-contrast','heading-order','aria-allowed-attr','aria-valid-attr','aria-required-attr','aria-hidden-body','duplicate-id-aria'].includes(id))
              .map(([id,audit]) => ({ id, title: audit.title, count: audit.details?.items?.length ?? 0 }))
            if (failingA11y.length) console.log(JSON.stringify({ file, failingA11y }))
            const opportunities = Object.entries(a)
              .filter(([,audit]) => typeof audit?.details?.overallSavingsMs === 'number' && audit.details.overallSavingsMs > 100)
              .map(([id,audit]) => ({ id, title: audit.title, savingsMs: Math.round(audit.details.overallSavingsMs) }))
              .sort((x,y) => y.savingsMs - x.savingsMs)
              .slice(0,8)
            if (opportunities.length) console.log(JSON.stringify({ file, opportunities }))
            const diagnostics = ['unused-javascript','bootup-time','mainthread-work-breakdown','dom-size','network-requests','total-byte-weight','long-tasks']
              .map(id => [id, a[id]])
              .filter(([,audit]) => audit && audit.score !== 1)
              .map(([id,audit]) => ({ id, title: audit.title, displayValue: audit.displayValue, numericValue: audit.numericValue }))
            if (diagnostics.length) console.log(JSON.stringify({ file, diagnostics }))
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-production-lighthouse
          path: .lighthouse/*.json
          retention-days: 7
