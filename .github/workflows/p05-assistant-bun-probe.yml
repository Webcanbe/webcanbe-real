name: P05 assistant Bun probe
on:
  push:
    branches: [phase2-p05-assistant-followup]
permissions:
  contents: read
jobs:
  bun-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch exact retained Todo evidence
        run: |
          mkdir -p /tmp/wcb-p05
          curl --fail --location --proto '=https' --tlsv1.2 -o /tmp/wcb-p05/bun.lockb https://raw.githubusercontent.com/tuanductran/todo-list-react/f48aef130c31452341450adfb6c3fc2234b79389/bun.lockb
          curl --fail --location --proto '=https' --tlsv1.2 -o /tmp/wcb-p05/package.json https://raw.githubusercontent.com/tuanductran/todo-list-react/f48aef130c31452341450adfb6c3fc2234b79389/package.json
          echo '4a6802815bb395350e14d4bd5d2162157bc2a21de755ca72c82a09dc8808c143  /tmp/wcb-p05/bun.lockb' | sha256sum -c -
      - run: npx --no-install tsc --noEmit --pretty false
      - name: Targeted Bun binary tests
        env:
          WCB_TODO_BUN_LOCK: /tmp/wcb-p05/bun.lockb
          WCB_TODO_PACKAGE: /tmp/wcb-p05/package.json
        run: npx --no-install vitest run src/webcanbe-engine/phase2-p05-bun-binary-decoder.test.ts src/webcanbe-engine/phase2-p05-bun-binary-real.test.ts src/webcanbe-engine/phase2-p05-bun-binary-alternate.test.ts
