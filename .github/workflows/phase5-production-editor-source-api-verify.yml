name: Phase 5 production editor source API verify
on:
  push:
    branches: [phase5-production-editor-source-api]
  pull_request:
    branches: [main]
    paths:
      - worker/editor-projects.js
      - worker/editor-projects.test.js
      - worker/index.js
      - .github/workflows/phase5-production-editor-source-api-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare runtime profile
        run: npm run runtime:prepare
      - name: Secret scan
        run: npm run security:secrets
      - name: Worker editor source regressions
        run: npx vitest run worker/editor-projects.test.js worker/materialization.test.js src/phase5-production-hosted-editor.test.ts src/phase5-gate4-launch-chain.test.ts src/phase5-editor-durable-export.test.ts src/phase5-editor-refresh-recovery.test.ts src/phase5-editor-save-policy.test.ts
      - name: Worker syntax
        run: node --check worker/editor-projects.js && node --check worker/index.js
      - name: Production build
        run: npm run build
      - name: Production build budget
        run: node scripts/launch/build-budget.mjs
      - name: Worker bundle dry run
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
