name: Phase 4 Mainline landing verify
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: git diff --check
      - name: Landing and public flow tests
        run: npx vitest run src/phase3-landing.test.ts src/phase4-public-flow.test.ts src/phase4-public-production.test.ts
      - name: Production build
        run: npm run build
      - name: Verify Mainline assets
        run: |
          test -f public/mainline/hero.webp
          test -f public/mainline/features/triage-card.svg
          test -f public/mainline/resource-allocation/templates.webp
          test -f public/mainline/testimonials/amy-chase.webp
          test -f dist/mainline/hero.webp
      - name: Verify frozen Phase 3 and main
        run: |
          test "$(git ls-remote origin refs/heads/phase-3-hosted-product | cut -f1)" = "5d3aa70dfd42e5706a23bd881e97e46665948a30"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "dd2d9cf8ffa6d82e4fdbb3e0ab37fa43ea9f945b"
      - name: Remove temporary verifier
        run: |
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase4-mainline-verify.yml
          git commit -m "Record verified Mainline landing checkpoint"
          git push origin HEAD:phase-4-product-ux
