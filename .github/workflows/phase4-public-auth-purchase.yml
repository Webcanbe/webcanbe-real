name: Phase 4 public auth purchase correction
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Apply Phase 4 public/auth/purchase correction
        run: |
          python scripts/phase4-public-auth-purchase.py
          python scripts/phase4-public-auth-purchase-tests.py
      - run: git diff --check
      - name: Focused Phase 4 tests
        run: npx vitest run src/phase3-landing.test.ts src/phase4-ux-foundation.test.ts src/phase4-product-hub.test.ts src/phase4-operations.test.ts src/phase4-public-flow.test.ts
      - name: Production build
        run: npm run build
      - name: Verify frozen branches
        run: |
          test "$(git ls-remote origin refs/heads/phase-3-hosted-product | cut -f1)" = "5d3aa70dfd42e5706a23bd881e97e46665948a30"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "dd2d9cf8ffa6d82e4fdbb3e0ab37fa43ea9f945b"
      - name: Publish correction
        run: |
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase4-public-auth-purchase.yml scripts/phase4-public-auth-purchase.py scripts/phase4-public-auth-purchase-tests.py
          git add src/App.tsx src/Home.tsx src/hostedProductClient.ts src/main.tsx src/phase4-public-flow.css src/phase4-public-flow.test.ts src/phase4-product-hub.test.ts src/phase4-operations.test.ts
          git commit -m "Correct Phase 4 public auth purchase flow"
          git push origin HEAD:phase-4-product-ux
