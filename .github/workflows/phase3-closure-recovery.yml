name: Phase 3 closure recovery

on:
  push:
    branches: [phase-3-hosted-product]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-test-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-hosted-product
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply closure recovery fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/webcanbe-engine/runtime/hostedProductController.ts')
          s = p.read_text()
          a = '      if (action === "/seller/applications/transition") {'
          b = '      if (action === "/seller/submissions/create") {'
          i = s.find(a)
          j = s.find(b, i)
          if i < 0 or j < 0:
              raise SystemExit('seller transition boundary missing')
          block = s[i:j]
          if 'controlTransitionSellerApplication' not in block:
              raise SystemExit('unexpected seller transition implementation')
          replacement = '''      if (action === "/seller/applications/transition") {
            exact(body, ["applicationId", "status"]); const status = text(body, "status")
            if (!["approved", "rejected"].includes(status)) throw new Error("Invalid seller application state.")
            return send(200, { application: await this.store.transitionSellerApplication(session, text(body, "applicationId"), status as "approved" | "rejected") })
          }
          if (action === "/control/seller-applications/transition") {
            exact(body, ["applicationId", "status", "stepUpEvidenceId", "idempotencyKey"]); const status = text(body, "status")
            if (!["approved", "rejected"].includes(status)) throw new Error("Invalid seller application state.")
            return send(200, { application: await this.store.controlTransitionSellerApplication(session, text(body, "stepUpEvidenceId"), text(body, "applicationId"), status as "approved" | "rejected", text(body, "idempotencyKey")) })
          }
'''
          p.write_text(s[:i] + replacement + s[j:])

          p = Path('src/webcanbe-engine/phase3-hosted-product.test.ts')
          s = p.read_text()
          marker = 'describe("Phase 3 Admin Control backend", () => {'
          h, sep, t = s.partition(marker)
          if not sep:
              raise SystemExit('Admin Control test section missing')
          if '"/seller/applications/transition"' not in t:
              raise SystemExit('Admin Control route references missing')
          t = t.replace('"/seller/applications/transition"', '"/control/seller-applications/transition"')
          s = h + sep + t
          old = '.split("async admitSellerZip", 2)[1].split("async sellerSubmissions", 1)[0]'
          new = '.split("async admitSellerZip", 2)[1].split("async admitSellerGitHub", 1)[0]'
          if s.count(old) != 1:
              raise SystemExit('ZIP assertion boundary missing or ambiguous')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
      - name: Final default regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify main
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "dd2d9cf8ffa6d82e4fdbb3e0ab37fa43ea9f945b"
      - name: Commit recovered fixes
        shell: bash
        run: |
          git config user.name 'WebCanBe Closure Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/webcanbe-engine/runtime/hostedProductController.ts src/webcanbe-engine/phase3-hosted-product.test.ts
          git commit -m 'Recover Phase 3 closure compatibility fixes'
          git push origin HEAD:phase-3-hosted-product
