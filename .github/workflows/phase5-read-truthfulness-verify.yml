name: Phase 5 read truthfulness verify
on:
  push:
    branches: [phase5-read-truthfulness]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Secret scan
        run: npm run security:secrets
      - name: Focused Phase 5 and inherited Phase 4 tests
        run: npx vitest run src/phase5-production-read-mode.test.ts src/phase5-brand.test.ts src/phase5-dashboard-polish.test.ts src/phase5-auth-production.test.ts src/phase5-firebase-auth.test.ts src/phase5-launch-hardening.test.ts worker/product-catalog.test.js worker/product-private.test.js worker/postgres-session.test.js src/hostedProductClient.test.ts src/phase4-final-shell.test.ts src/phase4-product-hub.test.ts
      - name: Worker syntax
        run: node --check worker/index.js && node --check worker/product-catalog.js && node --check worker/product-private.js && node --check worker/postgres-session.js
      - name: Production build
        run: npm run build
      - name: Worker bundle dry run
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
