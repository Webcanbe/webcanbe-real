name: Phase 5 UI verify
on:
  push:
    branches: [main, phase-5-product-launch, phase5-cloudflare-auth, phase5-dashboard-restore, phase5-ropean-dropdown-restore, phase5-dashboard-layer-animation, phase5-config-drawer, phase5-dashboard-final-ui, phase5-collapsed-sidebar-fix, phase5-firebase-auth, phase5-p5-1-session-unification, phase5-p5-1-deploy-fix, phase5-p5-2-public-catalog, phase5-p5-2-db-session, phase5-db-private-reads]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Focused Phase 5 and inherited Phase 4 tests
        run: npx vitest run src/phase5-brand.test.ts src/phase5-dashboard-polish.test.ts src/phase5-auth-production.test.ts src/phase5-google-branding.test.ts src/phase5-cloudflare-auth.test.ts src/phase5-firebase-auth.test.ts worker/firebase-auth.test.js worker/product-catalog.test.js worker/postgres-session.test.js worker/product-private.test.js src/hostedProductClient.test.ts src/phase4-brand-auth.test.ts src/phase4-final-shell.test.ts src/phase4-product-hub.test.ts src/phase4-public-flow.test.ts src/phase4-landing-webcanbe.test.ts
      - name: Worker syntax
        run: node --check worker/index.js && node --check worker/firebase-auth.js && node --check worker/product-catalog.js && node --check worker/product-private.js && node --check worker/hyperdrive.js && node --check worker/postgres-session.js
      - name: Production build
        run: npm run build
      - name: Worker bundle dry run
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
