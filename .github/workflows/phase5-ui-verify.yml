name: Phase 5 UI verify
on:
  push:
    branches: [phase-5-product-launch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Focused Phase 5 and inherited Phase 4 tests
        run: npx vitest run src/phase5-brand.test.ts src/phase4-brand-auth.test.ts src/phase4-final-shell.test.ts src/phase4-product-hub.test.ts src/phase4-public-flow.test.ts src/phase4-landing-webcanbe.test.ts
      - name: Production build
        run: npm run build
