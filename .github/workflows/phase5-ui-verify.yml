name: Phase 5 UI verify
on:
  push:
    branches: [main, phase5-bigperson-control, phase5-hyperdrive-live, phase-5-product-launch, phase5-cloudflare-auth, phase5-dashboard-restore, phase5-ropean-dropdown-restore, phase5-dashboard-layer-animation, phase5-config-drawer, phase5-dashboard-final-ui, phase5-collapsed-sidebar-fix, phase5-firebase-auth, phase5-p5-1-session-unification, phase5-p5-1-deploy-fix, phase5-p5-2-public-catalog, phase5-p5-2-db-session, phase5-db-private-reads, phase5-account-profile, phase5-production-read-mode, phase5-launch-security-headers, phase5-private-noindex, phase5-privacy-securitytxt, phase5-readiness-endpoint, phase5-request-observability, phase5-csp, phase5-rate-limits, phase5-route-error-hardening, phase5-seo-canonical, phase5-session-revocation, phase5-db-backup-ops, phase5-cloudflare-rollback-ops, phase5-secret-scan, phase5-account-auth-summary, phase5-explicit-identity-link, phase5-admin-live-control, phase5-cloudflare-typescript-runtime, phase5-session-created-at-fix, phase5-bigperson-pbkdf2-node-crypto, phase5-bigperson-pbkdf2-cloudflare-cap, phase5-bigperson-synced-passkey, phase5-product-operator-updated-at, phase5-admin-panel-only, phase5-bigperson-unified-operations, phase5-product-read-launch, phase5-gate2-private-read-preflight, phase5-gate2-auth-smoke-ui, phase5-gate2-auth-smoke-route-fix, phase5-gate2-safe-provider-link, phase5-auth-logos-spinner-polish, phase5-launch-truthfulness-cleanup, phase5-launch-browser-hardening, phase5-recovery-preflight, phase5-dr-tool-rehearsal, phase5-firebase-csp-popup, phase5-gate3-materialization-staging-v4]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare runtime profile
        run: npm run runtime:prepare
      - name: Secret scan
        run: npm run security:secrets
      - name: Focused Phase 5 and inherited Phase 4 tests
        run: npx vitest run src/phase5-project-unavailable.test.tsx src/phase5-brand.test.ts src/phase5-dashboard-polish.test.ts src/phase5-auth-production.test.ts src/phase5-auth-logo-spinner.test.ts src/phase5-google-branding.test.ts src/phase5-cloudflare-auth.test.ts src/phase5-firebase-auth.test.ts src/phase5-production-read-mode.test.ts src/phase5-gate2-auth-smoke.test.ts src/phase5-materialization-activation.test.ts scripts/launch/materialization-smoke-fixture.test.js src/phase5-gate4-launch-chain.test.ts src/phase5-editor-shortcuts.test.ts src/phase5-editor-navigation.test.ts src/phase5-project-search.test.ts src/phase5-editor-save-policy.test.ts src/phase5-editor-refresh-recovery.test.ts src/phase5-editor-durable-export.test.ts src/phase5-production-public-smoke.test.ts src/phase5-launch-hardening.test.ts src/phase5-launch-truthfulness.test.ts src/phase5-browser-hardening.test.ts src/phase5-csp-compat.test.ts src/phase5-route-error-hardening.test.ts src/phase5-seo-metadata.test.ts src/phase5-rate-limit.test.ts src/phase5-privacy-current.test.ts src/phase5-db-backup-ops.test.ts src/phase5-recovery-preflight.test.ts src/phase5-dr-tool-rehearsal.test.ts src/phase5-db-fk-indexes.test.ts src/phase5-session-schema.test.ts src/phase5-product-operator-schema.test.ts src/phase5-hyperdrive-config.test.ts src/phase5-cloudflare-rollback.test.ts src/phase5-secret-scan.test.ts worker/security-headers.test.js worker/readiness.test.js worker/telemetry.test.js worker/rate-limit.test.js worker/firebase-auth.test.js worker/product-catalog.test.js worker/postgres-session.test.js worker/product-private.test.js worker/materialization.test.js worker/account-profile.test.js worker/identity-link.test.js src/hostedProductClient.test.ts src/phase4-brand-auth.test.ts src/phase4-final-shell.test.ts src/phase4-product-hub.test.ts src/phase4-public-flow.test.ts src/phase4-landing-webcanbe.test.ts
      - name: Worker syntax
        run: node --check scripts/security/scan-secrets.mjs && node --check scripts/launch/browser-smoke.mjs && node --check scripts/launch/build-budget.mjs && node --check scripts/production-smoke-public.mjs && node --check scripts/cloudflare-rollback.mjs && node --check scripts/db/backup.mjs && node --check scripts/db/verify-backup.mjs && node --check scripts/db/recovery-preflight.mjs && node --check scripts/launch/materialization-smoke-fixture.mjs && node --check worker/index.js && node --check worker/readiness.js && node --check worker/telemetry.js && node --check worker/rate-limit.js && node --check worker/security-headers.js && node --check worker/firebase-auth.js && node --check worker/product-catalog.js && node --check worker/product-private.js && node --check worker/materialization.js && node --check worker/account-profile.js && node --check worker/identity-link.js && node --check worker/hyperdrive.js && node --check worker/postgres-session.js
      - name: Production build
        run: npm run build
      - name: Production build budget
        run: node scripts/launch/build-budget.mjs
      - name: Worker bundle dry run
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
