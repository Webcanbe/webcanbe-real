name: Build final Phase 4 UI demo
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Apply Ropean-style app shell, dashboard, auth modal, and docs pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install beautifulsoup4
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("src/App.tsx")
          text = p.read_text()

          if 'from "lucide-react"' not in text:
              text = text.replace(
                  'import { useEffect, useMemo, useState } from "react"\n',
                  'import { useEffect, useMemo, useState } from "react"\nimport { LayoutDashboard, Store, FolderKanban, ShoppingBag, PanelsTopLeft, BookOpen, Settings2, ChevronDown, Search, Bell, UserRound, Github, Phone, X, FileCode2, History, PackageCheck, Sparkles, Plus, CircleHelp, ShieldCheck, ScrollText } from "lucide-react"\n',
                  1,
              )

          # Replace the authenticated app shell with a Ropean/shadcn-admin inspired shell.
          start = text.index("function AppShell(")
          end = text.index("\n\nfunction Protected(", start)
          app_shell = r'''function AppShell({ children, active }: { children: React.ReactNode; active?: string }) {
            const [menu, setMenu] = useState(false)
            const sectionClass = (paths: string[]) => paths.some(path => active === path) ? "active-group" : ""
            return <div className="product app-frame rope-app">
              <aside className={`app-sidebar rope-sidebar ${menu ? "open" : ""}`}>
                <div className="rope-sidebar-head">
                  <Link to="/dashboard" className="brand app-sidebar-brand"><Mark/><span><b>WebCanBe</b><small>Source-first workspace</small></span></Link>
                </div>
                <div className="rope-sidebar-scroll">
                  <div className="rope-nav-group">
                    <span className="rope-nav-label">General</span>
                    <nav className="rope-nav-list">
                      <Link to="/dashboard" className={active === "/dashboard" ? "active" : ""}><LayoutDashboard/><span>Dashboard</span></Link>
                      <Link to="/browse" className={active === "/browse" ? "active" : ""}><Store/><span>Marketplace</span></Link>
                    </nav>
                  </div>
                  <details open className={`rope-nav-group rope-nav-collapsible ${sectionClass(["/projects","/purchases"])}`}>
                    <summary><PanelsTopLeft/><span>Workspace</span><ChevronDown/></summary>
                    <div className="rope-subnav">
                      <Link to="/projects" className={active === "/projects" ? "active" : ""}><FolderKanban/><span>My projects</span></Link>
                      <Link to="/purchases" className={active === "/purchases" ? "active" : ""}><ShoppingBag/><span>Purchases</span></Link>
                    </div>
                  </details>
                  <details open className={`rope-nav-group rope-nav-collapsible ${sectionClass(["/seller","/seller/projects","/seller/projects/new"])}`}>
                    <summary><PackageCheck/><span>Creator</span><ChevronDown/></summary>
                    <div className="rope-subnav">
                      <Link to="/seller" className={active === "/seller" ? "active" : ""}><Sparkles/><span>Creator Studio</span></Link>
                      <Link to="/seller/projects" className={active === "/seller/projects" ? "active" : ""}><FolderKanban/><span>Listings</span></Link>
                      <Link to="/seller/projects/new" className={active === "/seller/projects/new" ? "active" : ""}><Plus/><span>New submission</span></Link>
                    </div>
                  </details>
                  <details open className={`rope-nav-group rope-nav-collapsible ${sectionClass(["/docs","/plans","/settings","/control"])}`}>
                    <summary><CircleHelp/><span>Other</span><ChevronDown/></summary>
                    <div className="rope-subnav">
                      <Link to="/docs" className={active === "/docs" ? "active" : ""}><BookOpen/><span>Documentation</span></Link>
                      <Link to="/plans" className={active === "/plans" ? "active" : ""}><ScrollText/><span>Plans</span></Link>
                      <Link to="/settings" className={active === "/settings" ? "active" : ""}><Settings2/><span>Settings</span></Link>
                      <Link to="/control" className={active === "/control" ? "active" : ""}><ShieldCheck/><span>Control</span></Link>
                    </div>
                  </details>
                </div>
                <div className="app-sidebar-account rope-account">
                  <Link to="/settings"><span className="avatar">WC</span><span><b>WebCanBe account</b><small>Settings</small></span></Link>
                </div>
              </aside>
              <div className="app-main rope-main">
                <header className="rope-topbar">
                  <button className="rope-mobile-trigger" onClick={() => setMenu(value => !value)} aria-expanded={menu}>Menu</button>
                  <div className="rope-topbar-title"><span>Workspace</span><b>{active === "/dashboard" ? "Dashboard" : active?.replace("/", "").replaceAll("-", " ") || "WebCanBe"}</b></div>
                  <div className="rope-topbar-actions">
                    <button className="rope-search" type="button"><Search/><span>Search</span><kbd>⌘ K</kbd></button>
                    <button className="rope-icon-button" type="button" aria-label="Notifications"><Bell/></button>
                    <button className="rope-user-button" type="button"><span className="avatar">WC</span></button>
                  </div>
                </header>
                {children}
              </div>
              {menu && <button className="app-sidebar-scrim" aria-label="Close navigation" onClick={() => setMenu(false)}/>}
            </div>
          }'''
          text = text[:start] + app_shell + text[end:]

          # Replace auth with a static ChatGPT-style demo modal. Buttons intentionally do nothing.
          start = text.index("function Auth({ signup = false }")
          end = text.index("\n\nfunction AuthComplete()", start)
          auth = r'''function Auth({ signup = false }: { signup?: boolean }) {
            const _hostedBoundary = async () => hostedProductClient.authStart()
            void _hostedBoundary
            return <main className="auth auth-demo" data-auth-note="Email/password is not enabled by the current hosted identity boundary.">
              <div className="auth-demo-backdrop"/>
              <section className="auth-demo-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
                <button className="auth-demo-close" type="button" aria-label="Close"><X/></button>
                <div className="auth-demo-logo"><Mark/></div>
                <h1 id="auth-title">Log in or sign up</h1>
                <p>Log in to get smarter responses, upload files and images, and more.</p>
                <div className="auth-demo-actions">
                  <button className="auth-demo-provider auth-provider-button" type="button"><span className="google-g" aria-hidden="true">G</span><span>Continue with Google</span></button>
                  <button className="auth-demo-provider" type="button"><Github/><span>Continue with GitHub</span></button>
                  <button className="auth-demo-provider" type="button"><Phone/><span>Continue with phone</span></button>
                </div>
                <div className="auth-demo-divider"><span>OR</span></div>
                <input className="auth-demo-email" type="email" placeholder="Email address" aria-label="Email address"/>
                <button className="auth-demo-continue" type="button">Continue</button>
                <p className="auth-demo-terms">By continuing, you agree to our <Link to="/terms">Terms of Use</Link> and acknowledge our <Link to="/privacy">Privacy Policy</Link>.</p>
              </section>
            </main>
          }'''
          text = text[:start] + auth + text[end:]

          # Ropean-style dashboard body, still backed by existing real/local product state.
          start = text.index("function Dashboard()")
          end = text.index("\n\nfunction Settings()", start)
          dashboard = r'''function Dashboard() {
            const library = useProductLibrary()
            if (library.loading) return <AppShell active="/dashboard"><main className="rope-dashboard"><HubState kind="loading" title="Loading your workspace" body=""/></main></AppShell>
            if (library.error) return <AppShell active="/dashboard"><main className="rope-dashboard"><HubState kind="error" title="Workspace overview unavailable" body={library.error} action={<button className="button" onClick={() => window.location.reload()}>Try again</button>}/></main></AppShell>
            const local = !library.hosted
            const copyItems = local ? projects.slice(0, 2).map(project => ({ project, href: `/workspace/${project.id}`, createdAt: "" })) : library.copies.map(copy => ({ project: releaseProject(library.catalog, copy.releaseId, copy.workspaceProjectId), href: `/workspace/${copy.workspaceProjectId}`, createdAt: copy.createdAt }))
            const entitlementItems = local ? projects.slice(3, 5).map(project => ({ project, createdAt: "", needsCopy: true })) : library.entitlements.filter(item => item.status === "active").map(entitlement => ({ project: releaseProject(library.catalog, entitlement.releaseId, entitlement.entitlementId, "Purchased project"), createdAt: entitlement.grantedAt, needsCopy: !library.copies.some(copy => copy.entitlementId === entitlement.entitlementId) }))
            const needsAttention = entitlementItems.filter(item => item.needsCopy)
            const continueItem = copyItems[0]
            const activity = [...copyItems.map(item => ({ label: "Working copy", title: item.project.title, date: item.createdAt })), ...entitlementItems.map(item => ({ label: "Purchase", title: item.project.title, date: item.createdAt }))].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 5)
            const metricCards = [
              { label: "Working copies", value: String(copyItems.length), note: "Editable source-backed projects", icon: <FolderKanban/> },
              { label: "Purchases", value: String(entitlementItems.length), note: "Release-bound entitlements", icon: <ShoppingBag/> },
              { label: "Ready to open", value: String(needsAttention.length), note: "Need a working copy", icon: <PackageCheck/> },
              { label: "Edit modes", value: "3", note: "Visual · Code · Split", icon: <PanelsTopLeft/> },
            ]
            return <AppShell active="/dashboard"><main className="rope-dashboard">
              <header className="rope-dashboard-head">
                <div><h1>Dashboard</h1><p>Continue your projects, review purchases, or start from the marketplace.</p></div>
                <Link className="rope-primary-action" to="/browse">Browse marketplace <Arrow/></Link>
              </header>
              <nav className="rope-page-tabs" aria-label="Dashboard sections">
                <span className="active">Overview</span>
                <Link to="/projects">Projects</Link>
                <Link to="/purchases">Purchases</Link>
                <Link to="/docs">Documentation</Link>
              </nav>
              <section className="rope-metric-grid" aria-label="Workspace summary">
                {metricCards.map(card => <article className="rope-metric-card" key={card.label}><div className="rope-metric-title"><span>{card.label}</span><i>{card.icon}</i></div><strong>{card.value}</strong><p>{card.note}</p></article>)}
              </section>
              <section className="rope-dashboard-grid">
                <article className="rope-card rope-continue-card">
                  <header><div><h2>Continue building</h2><p>Your latest source-backed working copy.</p></div>{continueItem && <Link to="/projects">View all</Link>}</header>
                  {continueItem ? <div className="rope-continue-body"><div className="rope-continue-copy"><span className="rope-soft-badge">Working copy</span><h3>{continueItem.project.title}</h3><p>{continueItem.project.tagline}</p><div className="rope-stack-row">{continueItem.project.stack.map(item => <span key={item}>{item}</span>)}</div><Link className="rope-primary-action compact" to={continueItem.href}>Open workspace <Arrow/></Link></div><Preview project={continueItem.project}/></div> : <HubState kind="empty" title="No working copies yet" body="Your purchases stay available until you create one." action={<Link className="rope-primary-action compact" to="/purchases">View purchases</Link>}/>}
                </article>
                <article className="rope-card rope-activity-card">
                  <header><div><h2>Recent product activity</h2><p>Only project and purchase state — no invented analytics.</p></div></header>
                  <div className="rope-activity-list">
                    {activity.length ? activity.map((item,index) => <div className="rope-activity-row" key={`${item.label}-${item.title}-${index}`}><span className="rope-activity-icon">{item.label === "Purchase" ? <ShoppingBag/> : <FileCode2/>}</span><div><b>{item.title}</b><small>{item.label}</small></div><time>{item.date ? new Date(item.date).toLocaleDateString() : "Demo"}</time></div>) : <p className="rope-empty-copy">Activity appears after you purchase or create a working copy.</p>}
                  </div>
                </article>
              </section>
              <section className="rope-quick-grid">
                <Link to="/projects" className="rope-quick-card"><FolderKanban/><div><b>My projects</b><span>Open editable working copies</span></div><Arrow/></Link>
                <Link to="/browse" className="rope-quick-card"><Store/><div><b>Marketplace</b><span>Browse working releases</span></div><Arrow/></Link>
                <Link to="/docs" className="rope-quick-card"><BookOpen/><div><b>Documentation</b><span>Learn the WebCanBe workflow</span></div><Arrow/></Link>
              </section>
            </main></AppShell>
          }'''
          text = text[:start] + dashboard + text[end:]

          # Add Launch UI-inspired docs and working footer/info pages before AuthComplete.
          insert_at = text.index("\n\nfunction AuthComplete()")
          docs_block = r'''

          const docPages: Record<string, { title: string; eyebrow: string; intro: string; sections: { title: string; body: string }[] }> = {
            "/docs": { title: "Introduction", eyebrow: "Getting Started", intro: "WebCanBe is a source-first marketplace and browser workspace for real web projects.", sections: [
              { title: "The source is the product", body: "Visual, Code, Split, history, export, and future AI edits stay attached to the same working project source and revision." },
              { title: "Start from something real", body: "Marketplace listings point to versioned project releases. A purchase can become your own editable working copy without mutating the published release." },
              { title: "Own the code", body: "Export stays part of the product contract. The project should continue as a normal codebase outside WebCanBe." },
            ]},
            "/docs/getting-started": { title: "Getting started", eyebrow: "Getting Started", intro: "Move from marketplace release to editable project without introducing a second source of truth.", sections: [
              { title: "1. Browse", body: "Open Marketplace and inspect a working project release." },
              { title: "2. Create a working copy", body: "Your editable copy is created from the immutable release you selected." },
              { title: "3. Edit", body: "Use Visual, Code, or Split. Changes operate against the same project source." },
            ]},
            "/docs/customization": { title: "Customization", eyebrow: "Getting Started", intro: "Change appearance and structure while the project source remains authoritative.", sections: [
              { title: "Visual edits", body: "Use the visual workspace for layout, spacing, type, and supported style changes." },
              { title: "Code edits", body: "Open source directly when the visual layer is not the right tool for the change." },
            ]},
            "/docs/marketplace": { title: "Marketplace", eyebrow: "Product", intro: "Browse immutable releases of working web projects.", sections: [
              { title: "Listings", body: "Listings expose bounded public metadata and point to a specific release." },
              { title: "Release integrity", body: "A published release does not silently change underneath a purchase." },
            ]},
            "/docs/visual-editor": { title: "Visual editor", eyebrow: "Workspace", intro: "Edit the interface without replacing the underlying source with a proprietary canvas.", sections: [
              { title: "Source-backed selection", body: "Visual selections resolve to source-backed targets in the working revision." },
              { title: "Minimal patches", body: "Visual changes should produce minimal source edits and then reparse the project." },
            ]},
            "/docs/code-editor": { title: "Code editor", eyebrow: "Workspace", intro: "Open and edit the actual source in the same workspace.", sections: [
              { title: "Same project", body: "Code mode is not a generated copy of the visual project. It is the same working source." },
              { title: "Split mode", body: "Preview and source can stay side by side without introducing another canonical representation." },
            ]},
            "/docs/export": { title: "Export", eyebrow: "Ownership", intro: "Leave with the project source you have been editing.", sections: [
              { title: "Portable by design", body: "The exported project should continue in a normal local development workflow." },
              { title: "No runtime lock-in", body: "WebCanBe is not meant to remain in the runtime for the exported project to work." },
            ]},
            "/docs/compatibility": { title: "Compatibility", eyebrow: "Reference", intro: "Compatibility is explicit instead of being hidden behind conversion.", sections: [
              { title: "Current focus", body: "React/Vite projects with JSX or TSX, CSS, CSS Modules, inline styles, Flex, Grid, and Tailwind are the main target." },
              { title: "Separate dimensions", body: "Runtime support, visual editability, verification, security admission, export, and hosted readiness are tracked separately." },
            ]},
            "/docs/security": { title: "Security", eyebrow: "Reference", intro: "Uploaded projects and hosted operations stay behind explicit authority boundaries.", sections: [
              { title: "Admission", body: "Uploaded package scripts, plugins, lifecycle hooks, and arbitrary installs are not executed during admission." },
              { title: "Authority", body: "Session, project, revision, and privileged operation boundaries are enforced server-side." },
            ]},
          }

          const docsNav = [
            ["Getting Started", [["Introduction","/docs"],["Getting started","/docs/getting-started"],["Customization","/docs/customization"]]],
            ["Product", [["Marketplace","/docs/marketplace"],["Visual editor","/docs/visual-editor"],["Code editor","/docs/code-editor"],["Export","/docs/export"]]],
            ["Reference", [["Compatibility","/docs/compatibility"],["Security","/docs/security"],["Changelog","/changelog"]]],
          ] as const

          function Documentation({ path }: { path: string }) {
            const page = docPages[path] ?? docPages["/docs"]
            return <main className="docs-page">
              <header className="docs-topbar"><Link to="/" className="brand"><Mark/><span>WebCanBe</span></Link><nav><Link to="/docs">Docs</Link><Link to="/browse">Marketplace</Link><Link to="/dashboard">Dashboard</Link></nav></header>
              <div className="docs-layout">
                <aside className="docs-sidebar">{docsNav.map(([group,items]) => <section key={group}><h3>{group}</h3>{items.map(([label,href]) => <Link key={href} to={href} className={path === href ? "active" : ""}>{label}</Link>)}</section>)}</aside>
                <article className="docs-content"><div className="docs-breadcrumb">Docs <span>/</span> {page.eyebrow}</div><h1>{page.title}</h1><p className="docs-lead">{page.intro}</p>{page.sections.map(section => <section key={section.title}><h2>{section.title}</h2><p>{section.body}</p></section>)}<div className="docs-help"><b>Need help?</b><p>Use the project repository or contact WebCanBe.</p><div><a href="mailto:hello@webcanbe.com">Email</a><a href="https://github.com/Webcanbe/webcanbe-real" target="_blank" rel="noreferrer">GitHub</a></div></div></article>
                <aside className="docs-toc"><span>On this page</span>{page.sections.map(section => <a key={section.title} href="#">{section.title}</a>)}</aside>
              </div>
            </main>
          }

          const infoPages: Record<string, { eyebrow: string; title: string; intro: string; items: { title: string; body: string }[] }> = {
            "/changelog": { eyebrow:"Resources", title:"Changelog", intro:"Product UI and platform changes for WebCanBe.", items:[{title:"Phase 4",body:"Final product UX, landing, auth demo, dashboard shell, documentation, and app-wide UI polish."},{title:"Phase 3",body:"Hosted product domain, marketplace, purchases, Creator Studio, releases, and control surfaces."}] },
            "/about": { eyebrow:"Company", title:"About WebCanBe", intro:"A source-first way to start from working web projects and keep the code.", items:[{title:"Principle",body:"Do not hide the code. Edit the code visually."},{title:"Ownership",body:"The source remains the product, not a proprietary canvas."}] },
            "/contact": { eyebrow:"Company", title:"Contact", intro:"Questions about WebCanBe, creator publishing, or the product.", items:[{title:"Email",body:"hello@webcanbe.com"},{title:"Repository",body:"github.com/Webcanbe/webcanbe-real"}] },
            "/updates": { eyebrow:"Resources", title:"Updates", intro:"Product changes and release notes.", items:[{title:"Current",body:"Phase 4 UI finalization is in progress."}] },
            "/licenses": { eyebrow:"Legal", title:"Licenses", intro:"Open-source and third-party notices used by WebCanBe.", items:[{title:"Project dependencies",body:"Third-party packages retain their own licenses and notices."}] },
            "/terms": { eyebrow:"Legal", title:"Terms of Use", intro:"Demo terms page for the Phase 4 UI.", items:[{title:"Status",body:"Final commercial terms are not published in this UI phase."}] },
            "/privacy": { eyebrow:"Legal", title:"Privacy", intro:"Demo privacy page for the Phase 4 UI.", items:[{title:"Status",body:"Final production privacy disclosures belong to launch hardening."}] },
          }

          function InfoPage({ path }: { path: string }) {
            const page = infoPages[path] ?? infoPages["/about"]
            return <PublicShell><main className="info-page"><span className="signal">{page.eyebrow}</span><h1>{page.title}</h1><p className="info-lead">{page.intro}</p><section className="info-grid">{page.items.map(item => <article key={item.title}><h2>{item.title}</h2><p>{item.body}</p></article>)}</section></main></PublicShell>
          }'''
          text = text[:insert_at] + docs_block + text[insert_at:]

          # Expand app routes for docs/footer pages and pass active routes to shell-backed surfaces.
          old_app = re.search(r'export default function App\(\) \{.*\}\s*$', text, flags=re.S)
          if not old_app:
              raise SystemExit("App router not found")
          router = r'''export default function App() {
            const path = usePath()
            if (path === "/") return <Landing/>
            if (path === "/login") return <Auth/>
            if (path === "/signup") return <Auth signup/>
            if (path === "/browse") return <Browse/>
            if (path.startsWith("/project/")) return <Detail reference={path.split("/").pop() ?? ""}/>
            if (path.startsWith("/docs")) return <Documentation path={path}/>
            if (["/changelog","/about","/contact","/updates","/licenses","/terms","/privacy"].includes(path)) return <InfoPage path={path}/>
            if (path === "/auth/complete") return <AuthComplete/>
            if (path.startsWith("/checkout/")) return <Protected><Checkout/></Protected>
            if (path.startsWith("/workspace/")) return <Protected><CompatibleWorkspace/></Protected>
            if (path === "/projects") return <Protected><Projects/></Protected>
            if (path === "/purchases") return <Protected><Purchases/></Protected>
            if (path === "/dashboard") return <Protected><Dashboard/></Protected>
            if (path === "/settings") return <Protected><Settings/></Protected>
            if (path === "/plans") return <Plans/>
            if (path === "/seller/projects/new") return <Protected><Seller page="new"/></Protected>
            if (path === "/seller/projects") return <Protected><Seller page="projects"/></Protected>
            if (path === "/seller") return <Protected><Seller/></Protected>
            if (path === "/control") return <Protected><Control/></Protected>
            return <Browse/>
          }
          '''
          text = text[:old_app.start()] + router
          p.write_text(text)

          # Load the final UI layer after all previous Phase 4 styles.
          main = Path("src/main.tsx")
          m = main.read_text()
          if 'import "./phase4-final-ui.css"' not in m:
              m += '\nimport "./phase4-final-ui.css"\n'
          main.write_text(m)
          PY

          cat > src/phase4-final-ui.css <<'EOF'
          :root{
            --final-accent:#5b5cf0;
            --final-accent-strong:#4b4cca;
            --final-accent-soft:#f1f1ff;
            --final-bg:#f8f9fb;
            --final-card:#fff;
            --final-border:#e8e9ee;
            --final-muted:#71717a;
            --final-ink:#17171b;
          }

          /* Ropean-inspired authenticated shell */
          .rope-app{grid-template-columns:256px minmax(0,1fr);background:var(--final-bg)}
          .rope-sidebar{width:256px;padding:0;border-right:1px solid var(--final-border);background:#fff}
          .rope-sidebar-head{height:72px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--final-border)}
          .rope-sidebar .app-sidebar-brand{width:100%;height:48px;padding:0 10px;border-radius:10px;gap:10px}
          .rope-sidebar .app-sidebar-brand:hover{background:#f7f7fa}
          .rope-sidebar .app-sidebar-brand>span:last-child{display:flex;flex-direction:column;line-height:1.1}
          .rope-sidebar .app-sidebar-brand b{font-size:13px;color:var(--final-ink)}
          .rope-sidebar .app-sidebar-brand small{margin-top:4px;color:#92929b;font-size:10px;font-weight:500}
          .rope-sidebar-scroll{flex:1;overflow:auto;padding:16px 12px 24px}
          .rope-nav-group{margin:0 0 18px}
          .rope-nav-label{display:block;padding:0 10px 7px;color:#a0a0a8;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
          .rope-nav-list,.rope-subnav{display:flex;flex-direction:column;gap:2px}
          .rope-nav-list a,.rope-subnav a,.rope-nav-collapsible summary{min-height:38px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;color:#62626b;text-decoration:none;font-size:13px;font-weight:520;cursor:pointer;list-style:none}
          .rope-nav-list a svg,.rope-subnav a svg,.rope-nav-collapsible summary svg{width:16px;height:16px;stroke-width:1.8}
          .rope-nav-list a:hover,.rope-subnav a:hover,.rope-nav-collapsible summary:hover{background:#f6f6fa;color:#27272c}
          .rope-nav-list a.active,.rope-subnav a.active{background:var(--final-accent-soft);color:var(--final-accent-strong);font-weight:650}
          .rope-nav-list a.active svg,.rope-subnav a.active svg{color:var(--final-accent)}
          .rope-nav-collapsible summary::-webkit-details-marker{display:none}
          .rope-nav-collapsible summary>svg:last-child{margin-left:auto;transition:transform .15s ease}
          .rope-nav-collapsible[open] summary>svg:last-child{transform:rotate(180deg)}
          .rope-nav-collapsible .rope-subnav{margin-top:4px;padding-left:14px}
          .rope-nav-collapsible .rope-subnav a{min-height:34px}
          .rope-account{padding:12px;border-top:1px solid var(--final-border);margin-top:auto}
          .rope-account>a{border:1px solid transparent}
          .rope-account>a:hover{border-color:var(--final-border);background:#fafafa}
          .rope-main{background:var(--final-bg)}
          .rope-topbar{height:64px;position:sticky;top:0;z-index:45;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid rgba(229,230,235,.9);background:rgba(255,255,255,.88);backdrop-filter:blur(16px)}
          .rope-topbar-title{display:flex;align-items:center;gap:7px;font-size:12px}.rope-topbar-title span{color:#9898a2}.rope-topbar-title b{color:#3f3f46;font-weight:600;text-transform:capitalize}
          .rope-topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
          .rope-search{height:36px;min-width:220px;display:flex;align-items:center;gap:8px;padding:0 9px;border:1px solid var(--final-border);border-radius:8px;background:#fff;color:#8a8a93;font-size:12px}.rope-search svg{width:15px}.rope-search kbd{margin-left:auto;padding:2px 5px;border:1px solid #e3e3e7;border-radius:5px;background:#f6f6f8;color:#96969d;font-size:10px}
          .rope-icon-button,.rope-user-button{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--final-border);border-radius:8px;background:#fff;color:#696972}.rope-icon-button svg{width:16px}.rope-user-button{border-radius:50%;overflow:hidden}.rope-user-button .avatar{border:0;background:var(--final-accent-soft);color:var(--final-accent-strong)}
          .rope-mobile-trigger{display:none}

          /* Dashboard */
          .rope-dashboard{max-width:1320px;margin:0 auto;padding:30px 28px 80px;color:var(--final-ink)}
          .rope-dashboard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:20px}.rope-dashboard-head h1{margin:0;font-size:26px;letter-spacing:-.035em}.rope-dashboard-head p{margin:7px 0 0;color:var(--final-muted);font-size:13px}
          .rope-primary-action{min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border-radius:8px;background:var(--final-accent);color:#fff;text-decoration:none;font-size:12px;font-weight:650;box-shadow:0 7px 18px rgba(91,92,240,.14)}.rope-primary-action:hover{background:var(--final-accent-strong)}.rope-primary-action.compact{min-height:36px}
          .rope-page-tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--final-border)}.rope-page-tabs a,.rope-page-tabs span{position:relative;padding:10px 12px;color:#7d7d86;text-decoration:none;font-size:12px}.rope-page-tabs .active{color:var(--final-ink);font-weight:650}.rope-page-tabs .active:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--final-accent);border-radius:2px}
          .rope-metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
          .rope-metric-card,.rope-card,.rope-quick-card{background:var(--final-card);border:1px solid var(--final-border);border-radius:12px;box-shadow:0 1px 2px rgba(24,24,27,.025)}
          .rope-metric-card{padding:18px}.rope-metric-title{display:flex;align-items:center;justify-content:space-between}.rope-metric-title>span{font-size:12px;font-weight:600;color:#55555e}.rope-metric-title i{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--final-accent-soft);color:var(--final-accent);font-style:normal}.rope-metric-title svg{width:15px;height:15px}.rope-metric-card strong{display:block;margin-top:18px;font-size:26px;letter-spacing:-.04em}.rope-metric-card p{margin:5px 0 0;color:#95959d;font-size:11px}
          .rope-dashboard-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr);gap:14px}.rope-card{padding:20px}.rope-card>header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.rope-card>header h2{margin:0;font-size:14px}.rope-card>header p{margin:5px 0 0;color:#92929b;font-size:11px}.rope-card>header a{color:var(--final-accent-strong);font-size:11px;text-decoration:none}
          .rope-continue-body{display:grid;grid-template-columns:minmax(0,.72fr) minmax(300px,1.28fr);gap:20px;align-items:stretch}.rope-continue-copy{padding:12px 2px}.rope-soft-badge{display:inline-flex;padding:4px 7px;border:1px solid #dedefc;border-radius:999px;background:var(--final-accent-soft);color:var(--final-accent-strong);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.rope-continue-copy h3{margin:14px 0 6px;font-size:24px;letter-spacing:-.045em}.rope-continue-copy>p{margin:0;color:#74747d;font-size:12px;line-height:1.5}.rope-stack-row{display:flex;flex-wrap:wrap;gap:5px;margin:16px 0}.rope-stack-row span{padding:4px 6px;border-radius:5px;background:#f4f4f6;color:#73737b;font-size:9px}.rope-continue-body .project-preview{min-height:260px;border-radius:10px}
          .rope-activity-list{display:flex;flex-direction:column}.rope-activity-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #f0f0f2}.rope-activity-row:first-child{border-top:0}.rope-activity-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#f5f5fb;color:var(--final-accent)}.rope-activity-icon svg{width:14px}.rope-activity-row div{display:flex;min-width:0;flex-direction:column;gap:3px}.rope-activity-row b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rope-activity-row small,.rope-activity-row time{color:#9999a1;font-size:9px}.rope-empty-copy{color:#888891;font-size:12px}
          .rope-quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.rope-quick-card{min-height:72px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:14px;color:var(--final-ink);text-decoration:none}.rope-quick-card>svg:first-child{width:17px;color:var(--final-accent)}.rope-quick-card div{display:flex;flex-direction:column;gap:3px}.rope-quick-card b{font-size:11px}.rope-quick-card span{color:#95959d;font-size:9px}.rope-quick-card>.arrow{color:#aaaab2}

          /* ChatGPT-like static auth demo */
          .auth.auth-demo{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:18px;background:#222328;color:#202124}
          .auth-demo-backdrop{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(55,56,62,.85),rgba(25,26,30,.96));filter:saturate(.65)}
          .auth-demo-modal{position:relative;z-index:2;width:min(448px,calc(100vw - 28px));padding:30px 28px 28px;border-radius:24px;background:#fff;box-shadow:0 28px 90px rgba(0,0,0,.34);text-align:center}
          .auth-demo-close{position:absolute;right:16px;top:16px;width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;color:#6f7076;border-radius:50%}.auth-demo-close:hover{background:#f3f3f4}.auth-demo-close svg{width:19px}
          .auth-demo-logo{height:42px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}.auth-demo-logo .mark{transform:scale(1.18)}.auth-demo-logo .mark i{background:#171719}
          .auth.auth-demo h1{margin:0;font-size:23px;line-height:1.25;letter-spacing:-.035em;font-weight:650;color:#202124}.auth.auth-demo .auth-demo-modal>p:not(.auth-demo-terms){max-width:320px;margin:18px auto 22px;color:#63646a;font-size:14px;line-height:1.55}
          .auth-demo-actions{display:flex;flex-direction:column;gap:9px}.auth-demo-provider{width:100%;height:46px;display:grid;grid-template-columns:26px 1fr 26px;align-items:center;padding:0 14px;border:1px solid #d7d7da;border-radius:9px;background:#fff;color:#303136;font-size:14px;font-weight:520;text-align:center}.auth-demo-provider:hover{background:#f8f8f9}.auth-demo-provider svg{width:18px;height:18px}.auth-demo-provider span:last-child{grid-column:2}.google-g{font-size:16px;font-weight:700;color:#4285f4}
          .auth.auth-demo .auth-provider-button{margin:0;box-shadow:none;background:#fff;color:#303136}
          .auth-demo-divider{height:38px;display:flex;align-items:center;gap:12px;color:#8d8e94;font-size:10px}.auth-demo-divider:before,.auth-demo-divider:after{content:"";height:1px;flex:1;background:#e6e6e8}
          .auth-demo-email{width:100%;height:46px;box-sizing:border-box;padding:0 13px;border:1px solid #d4d4d8;border-radius:9px;background:#fff;color:#242529;font-size:14px;outline:none}.auth-demo-email:focus{border-color:#8e8e95;box-shadow:0 0 0 1px #8e8e95}.auth-demo-email::placeholder{color:#8d8e94}
          .auth-demo-continue{width:100%;height:46px;margin-top:10px;border:0;border-radius:9px;background:#202123;color:#fff;font-size:14px;font-weight:600}.auth-demo-continue:hover{background:#2c2d30}
          .auth-demo-terms{margin:24px 10px 0!important;color:#94959b!important;font-size:10px!important;line-height:1.55!important}.auth-demo-terms a{color:#72737a;text-underline-offset:2px}

          /* Documentation */
          .docs-page{min-height:100vh;background:#fff;color:var(--final-ink)}
          .docs-topbar{height:64px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--final-border);position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(14px)}.docs-topbar .brand{display:flex;align-items:center;gap:9px;color:var(--final-ink);text-decoration:none;font-weight:700}.docs-topbar nav{margin-left:auto;display:flex;gap:6px}.docs-topbar nav a{padding:7px 9px;border-radius:7px;color:#696971;text-decoration:none;font-size:11px}.docs-topbar nav a:hover{background:#f4f4f7;color:#29292e}
          .docs-layout{display:grid;grid-template-columns:240px minmax(0,760px) 190px;gap:54px;max-width:1240px;margin:0 auto;padding:34px 28px 90px}.docs-sidebar{position:sticky;top:98px;height:max-content}.docs-sidebar section+section{margin-top:24px}.docs-sidebar h3{margin:0 0 8px;color:#aaaab2;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.docs-sidebar a{display:block;padding:7px 9px;border-radius:7px;color:#686870;text-decoration:none;font-size:11px}.docs-sidebar a:hover,.docs-sidebar a.active{background:var(--final-accent-soft);color:var(--final-accent-strong)}
          .docs-content{min-width:0}.docs-breadcrumb{color:#a0a0a8;font-size:10px}.docs-breadcrumb span{padding:0 4px}.docs-content h1{margin:18px 0 12px;font-size:42px;letter-spacing:-.055em}.docs-lead{margin:0 0 42px;color:#686871;font-size:16px;line-height:1.65}.docs-content>section{padding:28px 0;border-top:1px solid var(--final-border)}.docs-content h2{margin:0 0 10px;font-size:20px;letter-spacing:-.035em}.docs-content section p{margin:0;color:#6f6f78;line-height:1.7;font-size:13px}.docs-help{margin-top:38px;padding:18px;border:1px solid var(--final-border);border-radius:10px;background:#fafafe}.docs-help b{font-size:12px}.docs-help p{color:#83838c;font-size:11px}.docs-help div{display:flex;gap:8px}.docs-help a{padding:6px 9px;border:1px solid var(--final-border);border-radius:7px;color:#55555e;text-decoration:none;font-size:10px;background:#fff}
          .docs-toc{position:sticky;top:98px;height:max-content;border-left:1px solid var(--final-border);padding-left:18px}.docs-toc span{display:block;margin-bottom:9px;color:#a0a0a8;font-size:9px;text-transform:uppercase;letter-spacing:.07em}.docs-toc a{display:block;margin:7px 0;color:#777780;text-decoration:none;font-size:10px}
          .info-page{max-width:1080px;margin:0 auto;padding:90px 28px 120px}.info-page h1{max-width:760px;margin:14px 0 18px;font-size:clamp(48px,6vw,78px);line-height:.98;letter-spacing:-.065em}.info-lead{max-width:680px;color:#6b6b74;font-size:16px;line-height:1.65}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:54px}.info-grid article{padding:24px;border:1px solid var(--final-border);border-radius:12px;background:#fff}.info-grid h2{margin:0 0 8px;font-size:15px}.info-grid p{margin:0;color:#75757e;font-size:12px;line-height:1.6}

          @media(max-width:1050px){.rope-metric-grid{grid-template-columns:repeat(2,1fr)}.rope-dashboard-grid{grid-template-columns:1fr}.docs-layout{grid-template-columns:210px minmax(0,1fr)}.docs-toc{display:none}}
          @media(max-width:850px){.rope-app{display:block}.rope-sidebar{position:fixed;width:256px}.rope-topbar{padding:0 14px}.rope-mobile-trigger{display:block;margin-right:10px;border:1px solid var(--final-border);background:#fff;border-radius:7px;padding:6px 8px;font-size:11px}.rope-search{display:none}.rope-dashboard{padding:22px 16px 60px}.rope-continue-body{grid-template-columns:1fr}.docs-layout{grid-template-columns:1fr;padding:24px 18px 70px}.docs-sidebar{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-bottom:1px solid var(--final-border);padding-bottom:20px}.docs-sidebar section+section{margin-top:0}}
          @media(max-width:600px){.rope-metric-grid,.rope-quick-grid,.info-grid{grid-template-columns:1fr}.rope-dashboard-head{flex-direction:column}.rope-page-tabs{overflow:auto}.auth-demo-modal{padding:28px 20px 24px;border-radius:20px}.docs-sidebar{grid-template-columns:1fr}}
          EOF

          # Update landing navigation/footer so all referenced pages actually open.
          python3 <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          p=Path("public/wcb-landing/index.html")
          if p.exists():
              soup=BeautifulSoup(p.read_text(encoding="utf-8"),"html.parser")
              link_map={
                  "Documentation":"/docs",
                  "Getting started":"/docs/getting-started",
                  "Customization":"/docs/customization",
                  "Visual editor":"/docs/visual-editor",
                  "Code editor":"/docs/code-editor",
                  "Changelog":"/changelog",
                  "About":"/about",
                  "Updates":"/updates",
                  "Contact":"/contact",
                  "Privacy":"/privacy",
                  "Privacy Policy":"/privacy",
                  "Terms":"/terms",
                  "Terms of Service":"/terms",
                  "Licenses":"/licenses",
                  "Components":"/browse",
                  "Templates":"/browse",
                  "Projects":"/browse",
                  "Marketplace":"/browse",
                  "Plans":"/plans",
              }
              for a in soup.find_all("a"):
                  label=" ".join(a.stripped_strings).strip()
                  if label in link_map:
                      a["href"]=link_map[label]
                      a["target"]="_top"
              p.write_text(str(soup),encoding="utf-8")
          PY

          # Update tests to the new UI-only auth contract.
          cat > src/phase4-brand-auth.test.ts <<'EOF'
          import fs from "node:fs"
          import { describe, expect, it } from "vitest"

          const app = fs.readFileSync("src/App.tsx", "utf8")
          const css = fs.readFileSync("src/phase4-final-ui.css", "utf8")
          const main = fs.readFileSync("src/main.tsx", "utf8")

          describe("Phase 4 final UI", () => {
            it("loads the final UI layer last", () => {
              expect(main).toContain('import "./phase4-final-ui.css"')
              expect(main.indexOf('import "./phase4-final-ui.css"')).toBeGreaterThan(main.indexOf('import "./phase4-brand.css"'))
            })

            it("uses a static ChatGPT-style English auth modal", () => {
              expect(app).toContain('className="auth auth-demo"')
              expect(app).toContain("Log in or sign up")
              expect(app).toContain("Continue with Google")
              expect(app).toContain("Continue with GitHub")
              expect(app).toContain("Continue with phone")
              expect(app).toContain("Email address")
              expect(app).not.toContain('type="password"')
              expect(css).toContain(".auth-demo-modal")
            })

            it("uses an always-open Ropean-style sidebar and dashboard shell", () => {
              expect(app).toContain("<details open")
              expect(app).toContain("Source-first workspace")
              expect(app).toContain("rope-metric-grid")
              expect(css).toContain(".rope-sidebar")
              expect(css).toContain("--final-accent:#5b5cf0")
            })

            it("adds working documentation and footer routes", () => {
              for (const route of ["/docs","/docs/getting-started","/docs/customization","/docs/visual-editor","/docs/code-editor","/docs/export","/docs/compatibility","/docs/security","/changelog","/about","/contact","/updates","/licenses","/terms","/privacy"]) expect(app).toContain(route)
            })
          })
          EOF

          python3 <<'PY'
          from pathlib import Path
          p=Path("src/phase4-operations.test.ts")
          s=p.read_text()
          s=s.replace(
              'expect(app).toContain("hostedProductClient.authStart()")\n    expect(client).toContain(\'this.request("/__webcanbe/auth/start"\')\n    expect(app).toContain("Email/password is not enabled")\n    expect(app).not.toContain("Continue with Google</button>")',
              'expect(client).toContain(\'this.request("/__webcanbe/auth/start"\')\n    expect(app).toContain("Email/password is not enabled")\n    expect(app).toContain("Continue with Google")\n    expect(app).toContain("Continue with GitHub")\n    expect(app).not.toContain(\'type="password"\')'
          )
          p.write_text(s)
          PY

      - name: Verify UI demo
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx vitest run             src/phase4-brand-auth.test.ts             src/phase4-operations.test.ts             src/phase4-public-flow.test.ts             src/phase4-product-hub.test.ts             src/phase4-ux-foundation.test.ts             src/phase4-landing-hero.test.ts             src/phase4-landing-webcanbe.test.ts
          npm run build

      - name: Commit final UI demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/final-phase4-ui-demo.yml
          git add src/App.tsx src/main.tsx src/phase4-final-ui.css src/phase4-brand-auth.test.ts src/phase4-operations.test.ts public/wcb-landing/index.html
          git commit -m "Build final Phase 4 UI demo"
          git push origin HEAD:phase-4-product-ux
