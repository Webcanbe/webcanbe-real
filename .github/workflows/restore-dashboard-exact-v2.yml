name: Restore dashboard exact v2
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Verify Ropean framing
        run: |
          set -euo pipefail
          headers="$(curl -sSIL --max-time 30 https://shadcn-admin-template.ropean.org/)"
          printf '%s\n' "$headers"
          ! printf '%s\n' "$headers" | grep -qi '^x-frame-options: *deny'
          ! printf '%s\n' "$headers" | grep -qi '^x-frame-options: *sameorigin'
          ! printf '%s\n' "$headers" | grep -qiE '^content-security-policy:.*frame-ancestors'
      - name: Apply exact dashboard and hero auth bridge
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path("src/App.tsx")
          text = app.read_text()

          start = text.index("function Dashboard()")
          end = text.index("\n\nfunction Settings()", start)
          dashboard = '''function Dashboard() {
            return <main className="ropean-original-dashboard" aria-label="Ropean dashboard template">
              <iframe
                title="Ropean shadcn admin dashboard"
                src="https://shadcn-admin-template.ropean.org/"
                referrerPolicy="no-referrer"
              />
            </main>
          }'''
          text = text[:start] + dashboard + text[end:]

          insert_anchor = '''  useEffect(() => {
    if (directAuth) setAuthIntent({ signup: path === "/signup" })
  }, [directAuth, path])'''
          message_effect = '''  useEffect(() => {
    const messageHandler = (event: MessageEvent) => {
      if (event.origin !== window.location.origin) return
      const data = event.data as { type?: unknown; signup?: unknown } | null
      if (!data || data.type !== "wcb:open-auth") return
      setAuthIntent({ signup: Boolean(data.signup) })
    }
    window.addEventListener("message", messageHandler)
    return () => window.removeEventListener("message", messageHandler)
  }, [])

'''
          if 'window.addEventListener("message", messageHandler)' not in text:
              if insert_anchor not in text:
                  raise SystemExit("direct auth effect anchor missing")
              text = text.replace(insert_anchor, message_effect + insert_anchor, 1)
          app.write_text(text)

          landing = Path("public/wcb-landing/index.html")
          html = landing.read_text(encoding="utf-8")
          html = re.sub(r'<script id="wcb-auth-bridge">.*?</script>', '', html, flags=re.S)
          bridge = """<script id="wcb-auth-bridge">
          (() => {
            document.addEventListener("click", (event) => {
              const anchor = event.target instanceof Element ? event.target.closest("a[href]") : null;
              if (!anchor) return;
              const href = anchor.getAttribute("href");
              if (!href) return;
              let url;
              try { url = new URL(href, window.location.origin); } catch { return; }
              if (url.origin !== window.location.origin) return;
              if (url.pathname !== "/signup" && url.pathname !== "/login") return;
              event.preventDefault();
              event.stopPropagation();
              window.parent.postMessage({ type: "wcb:open-auth", signup: url.pathname === "/signup" }, window.location.origin);
            }, true);
          })();
          </script>"""
          if "</body>" not in html:
              raise SystemExit("landing body missing")
          landing.write_text(html.replace("</body>", bridge + "</body>", 1), encoding="utf-8")

          css = Path("src/phase4-final-ui.css")
          cs = css.read_text()
          if ".ropean-original-dashboard{" not in cs:
              cs += """
          .ropean-original-dashboard{width:100%;height:100vh;min-height:100vh;margin:0;padding:0;overflow:hidden;background:#fff}
          .ropean-original-dashboard iframe{display:block;width:100%;height:100%;border:0;margin:0;padding:0;background:#fff}
          """
          css.write_text(cs)

          Path("src/phase4-final-shell.test.ts").write_text("""import fs from "node:fs"
          import { describe, expect, it } from "vitest"
          const app = fs.readFileSync("src/App.tsx","utf8")
          const landing = fs.readFileSync("public/wcb-landing/index.html","utf8")
          describe("Phase 4 exact dashboard and hero auth bridge", () => {
            it("uses the exact live Ropean dashboard", () => {
              expect(app).toContain('src="https://shadcn-admin-template.ropean.org/"')
              expect(app).toContain('className="ropean-original-dashboard"')
              expect(app).not.toContain('const [pane, setPane] = useState("overview")')
            })
            it("opens auth from the landing without reloading", () => {
              expect(landing).toContain('id="wcb-auth-bridge"')
              expect(landing).toContain('type: "wcb:open-auth"')
              expect(app).toContain('window.addEventListener("message", messageHandler)')
            })
          })
          """.replace("          ",""))

          t = Path("src/phase4-product-hub.test.ts")
          s = t.read_text()
          s = re.sub(
              r'  it\("derives dashboard attention from real purchase/copy state rather than fake analytics", \(\) => \{.*?\n  \}\)',
              '''  it("temporarily uses the exact Ropean dashboard during UI finalization", () => {
                expect(app).toContain('src="https://shadcn-admin-template.ropean.org/"')
                expect(app).toContain('className="ropean-original-dashboard"')
              })''',
              s,
              count=1,
              flags=re.S,
          )
          t.write_text(s)
          PY
      - name: Verify
        run: |
          set -euo pipefail
          npm ci
          npx vitest run src/phase4-final-shell.test.ts src/phase4-brand-auth.test.ts src/phase4-product-hub.test.ts src/phase4-public-flow.test.ts src/phase4-operations.test.ts
          npm run build
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/restore-dashboard-exact-v2.yml
          git rm -f .github/workflows/restore-exact-ropean-dashboard.yml || true
          git add src/App.tsx src/phase4-final-ui.css src/phase4-final-shell.test.ts src/phase4-product-hub.test.ts public/wcb-landing/index.html
          git commit -m "Restore exact Ropean dashboard"
          git push origin HEAD:phase-4-product-ux
