name: Phase 4 exact Mainline landing port
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  port-mainline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Materialize exact user-selected Mainline port
        shell: bash
        env:
          MAINLINE_HOME_Z: 
          MAINLINE_CSS_Z: 
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os,base64,zlib
          from pathlib import Path
          Path('src/Home.tsx').write_bytes(zlib.decompress(base64.b64decode(os.environ['MAINLINE_HOME_Z'])))
          Path('src/landing.module.css').write_bytes(zlib.decompress(base64.b64decode(os.environ['MAINLINE_CSS_Z'])))
          PYCODE
          rm -rf /tmp/mainline
          git clone --quiet https://github.com/shadcnblocks/mainline-nextjs-template.git /tmp/mainline
          git -C /tmp/mainline checkout --quiet 2329ed3524a6038d834b925187084a0e41fab2d9
          test "$(git -C /tmp/mainline rev-parse HEAD)" = "2329ed3524a6038d834b925187084a0e41fab2d9"
          test "$(git -C /tmp/mainline hash-object src/app/page.tsx)" = "55896169bfd8c2639c735fa8a72e51f5451cdb65"
          test "$(git -C /tmp/mainline hash-object src/components/blocks/navbar.tsx)" = "edb3641abf13f1ac2d945bff27508cf019d309bd"
          test "$(git -C /tmp/mainline hash-object src/components/blocks/hero.tsx)" = "8e7196690a2b41184333c352fa55c6d3dfd2df7e"
          test "$(git -C /tmp/mainline hash-object src/styles/globals.css)" = "2c7f39c041f14bca913963d839f42b5aafb009ed"
          rm -rf public/mainline
          mkdir -p public/mainline/features public/mainline/resource-allocation public/mainline/testimonials public/mainline/logos docs/third-party docs/reports
          cp /tmp/mainline/public/hero.webp public/mainline/hero.webp
          cp /tmp/mainline/public/features/triage-card.svg /tmp/mainline/public/features/cycle-card.svg /tmp/mainline/public/features/overview-card.svg public/mainline/features/
          cp /tmp/mainline/public/resource-allocation/*.webp public/mainline/resource-allocation/
          cp /tmp/mainline/public/testimonials/*.webp public/mainline/testimonials/
          cp /tmp/mainline/public/logos/*.svg public/mainline/logos/
          cp /tmp/mainline/LICENSE docs/third-party/mainline-LICENSE.txt
          cat > docs/reports/phase4-mainline-exact-port.md <<'EOF'
          # Phase 4 exact Mainline landing port

          Source supplied by user: `mainline-nextjs-template-master (1).zip`.

          - User-uploaded ZIP SHA-256: `fb87ff15d40e83737690cc5444efdcd9ca73f4b56d999a1766f05d2d379d78ac`
          - Verified matching upstream repository: `shadcnblocks/mainline-nextjs-template`
          - Pinned upstream commit: `2329ed3524a6038d834b925187084a0e41fab2d9`
          - Mainline homepage composition and original visual assets are preserved while Next.js-only plumbing is adapted to WebCanBe's React 19 + Vite app.
          - WebCanBe-specific changes are brand/copy/links plus the explicit removal of Pricing from the public top navigation. The body pricing section remains part of the original homepage composition.
          - Existing product routes, hosted authority, editor engine, and marketplace backend remain outside this landing-only port.
          - Third-party license notice is preserved at `docs/third-party/mainline-LICENSE.txt`.
          EOF
      - run: git diff --check
      - name: Focused landing and public-flow tests
        run: npx vitest run src/phase3-landing.test.ts src/phase4-public-flow.test.ts src/phase4-public-production.test.ts src/phase4-ux-foundation.test.ts
      - name: Production build
        run: npm run build
      - name: Verify frozen branches
        run: |
          test "$(git ls-remote origin refs/heads/phase-3-hosted-product | cut -f1)" = "5d3aa70dfd42e5706a23bd881e97e46665948a30"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "dd2d9cf8ffa6d82e4fdbb3e0ab37fa43ea9f945b"
      - name: Publish exact Mainline landing port
        run: |
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase4-mainline-exact-port.yml
          git add src/Home.tsx src/landing.module.css public/mainline docs/third-party/mainline-LICENSE.txt docs/reports/phase4-mainline-exact-port.md
          git commit -m "Port exact Mainline landing composition"
          git push origin HEAD:phase-4-product-ux
