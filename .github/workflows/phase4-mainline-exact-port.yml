name: Phase 4 Mainline exact landing port
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Port uploaded Mainline landing reference
        run: python scripts/phase4-mainline-exact-port.py
      - run: git diff --check
      - name: Focused landing and public-flow tests
        run: npx vitest run src/phase3-landing.test.ts src/phase4-public-flow.test.ts src/phase4-public-production.test.ts
      - name: Production build
        run: npm run build
      - name: Verify frozen branches
        run: |
          test "$(git ls-remote origin refs/heads/phase-3-hosted-product | cut -f1)" = "5d3aa70dfd42e5706a23bd881e97e46665948a30"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "dd2d9cf8ffa6d82e4fdbb3e0ab37fa43ea9f945b"
      - name: Publish exact landing port
        run: |
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase4-mainline-exact-port.yml scripts/phase4-mainline-exact-port.py
          git add src/Home.tsx src/landing.module.css src/assets/mainline third_party/mainline
          git commit -m "Port Mainline landing from source template"
          git push origin HEAD:phase-4-product-ux
