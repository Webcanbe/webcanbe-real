name: Apply WebCanBe brand and auth UI
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-product-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Apply brand palette and shadcn-inspired auth
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path("src/App.tsx")
          text = app.read_text()
          start = text.index("function Auth({ signup = false }")
          end = text.index("\n\nfunction AuthComplete()", start)

          replacement = r'''function Auth({ signup = false }: { signup?: boolean }) {
            const hosted = hostedProductMode(), next = authNext()
            const [busy, setBusy] = useState(false), [error, setError] = useState("")
            const begin = async () => {
              if (busy) return
              if (!hosted) { go(next); return }
              setBusy(true); setError("")
              try {
                sessionStorage.setItem("wcb-auth-next", next)
                window.location.assign(await hostedProductClient.authStart())
              } catch (reason) {
                setError(reason instanceof Error ? reason.message : "Sign-in is unavailable.")
                setBusy(false)
              }
            }

            return <main className="auth auth-split">
              <section className="auth-split-panel">
                <div className="auth-split-brand">
                  <Link to="/" className="brand auth-brand"><Mark/><span>WebCanBe</span></Link>
                </div>
                <div className="auth-split-center">
                  <div className="auth-split-form">
                    <span className="auth-kicker">{signup ? "Create account" : "Welcome back"}</span>
                    <h1>{signup ? "Start with real code." : "Continue building."}</h1>
                    <p>{signup ? "Create your WebCanBe account through the configured identity provider and start from a working project." : "Sign in to return to your projects, purchases, and browser workspace."}</p>
                    <button className="auth-provider-button" disabled={busy} onClick={() => void begin()}>
                      <span className="auth-provider-icon" aria-hidden="true">↗</span>
                      <span>{busy ? "Opening sign-in…" : signup ? "Continue to create account" : "Continue to sign in"}</span>
                    </button>
                    {error && <p className="auth-error" role="alert">{error}</p>}
                    <div className="auth-boundary-note">
                      <span>Secure sign-in</span>
                      <p>Email/password is not enabled by the current hosted identity boundary. Authentication continues through WebCanBe’s configured identity provider, and no second password system is simulated here.</p>
                    </div>
                    {next !== "/dashboard" && <p className="auth-return">After sign-in, continue to <code>{next}</code>.</p>}
                    <p className="auth-switch">{signup ? "Already have an account?" : "New to WebCanBe?"} <Link to={`${signup ? "/login" : "/signup"}?next=${encodeURIComponent(next)}`}>{signup ? "Log in" : "Create an account"}</Link></p>
                  </div>
                </div>
                <p className="auth-split-foot">The source is the product.</p>
              </section>
              <aside className="auth-split-visual" aria-label="WebCanBe product preview">
                <div className="auth-visual-glow"/>
                <div className="auth-visual-copy">
                  <span>Visual editing. Real source.</span>
                  <h2>Edit the interface.<br/>Keep the code.</h2>
                  <p>Visual, Code, and Split stay attached to the same working project.</p>
                </div>
                <div className="auth-visual-frame"><img src="/mainline/hero.webp" alt="WebCanBe browser workspace"/></div>
              </aside>
            </main>
          }'''

          app.write_text(text[:start] + replacement + text[end:])

          main = Path("src/main.tsx")
          m = main.read_text()
          brand_import = 'import "./phase4-brand.css"'
          if brand_import not in m:
              anchor = 'import "./phase4-public-flow.css"'
              if anchor not in m:
                  raise SystemExit("phase4 public flow import anchor not found")
              m = m.replace(anchor, anchor + "\n" + brand_import, 1)
          main.write_text(m)
          PY

          cat > src/phase4-brand.css <<'EOF'
          /* Phase 4 brand layer.
             Electric indigo is WebCanBe's single product accent.
             The Launch UI public landing remains intentionally unchanged. */
          :root {
            --wcb-brand: #5b5cf0;
            --wcb-brand-hover: #4c4ddd;
            --wcb-brand-strong: #4243c7;
            --wcb-brand-soft: #f1f1ff;
            --wcb-brand-softer: #f7f7ff;
            --wcb-brand-line: #dadaff;
            --wcb-brand-ring: rgba(91,92,240,.24);
            --wcb-ink: #111114;
          }

          ::selection { background: #ddddff; color: #17172a; }
          :focus-visible { outline-color: var(--wcb-brand); }

          .product-header .mark i,
          .product .mark i,
          .auth .mark i,
          .workspace .mark i,
          .app-sidebar .mark i,
          .checkout-page .mark i {
            background: var(--wcb-brand);
          }

          .button.primary,
          .workspace-actions .workspace-publish,
          .ai-input button,
          .filters .selected,
          .profile-avatar {
            background: var(--wcb-brand);
            border-color: var(--wcb-brand);
            color: #fff;
          }
          .button.primary:hover,
          .workspace-actions .workspace-publish:hover,
          .ai-input button:hover {
            background: var(--wcb-brand-hover);
            border-color: var(--wcb-brand-hover);
          }

          .app-sidebar nav a.active {
            background: var(--wcb-brand);
            color: #fff;
          }
          .app-sidebar nav a:not(.active):hover,
          .app-sidebar-secondary > a:hover {
            background: var(--wcb-brand-softer);
            color: var(--wcb-brand-strong);
          }

          .product-header nav a.active,
          .product-header nav a:hover,
          .quiet-link:hover,
          .settings > aside button:hover,
          .settings > aside button.active {
            color: var(--wcb-brand-strong);
            background: var(--wcb-brand-softer);
          }

          .tabs .active {
            color: var(--wcb-brand-strong);
            border-bottom-color: var(--wcb-brand);
          }
          .signal,
          .project-eyebrow {
            color: #6262c9;
          }
          .search:focus-within,
          .auth input:focus,
          .settings input:focus,
          .settings select:focus,
          .new-listing input:focus,
          .new-listing select:focus {
            border-color: #aaaaf7;
            box-shadow: 0 0 0 3px var(--wcb-brand-ring);
          }

          .checkout-summary,
          .plan-grid article.featured {
            border-color: var(--wcb-brand-line);
          }

          /* shadcn login-02 inspired auth composition; real auth behavior stays in App.tsx. */
          .auth.auth-split {
            min-height: 100svh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(520px, 1fr);
            background: #fff;
            color: var(--wcb-ink);
          }
          .auth-split-panel {
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 100svh;
            padding: 32px clamp(28px, 4vw, 64px);
            background: #fff;
          }
          .auth-split-brand {
            display: flex;
            align-items: center;
            min-height: 36px;
          }
          .auth-split-brand .auth-brand {
            position: static;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--wcb-ink);
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
          }
          .auth-split-center {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 48px 0 72px;
          }
          .auth-split-form {
            width: min(100%, 390px);
          }
          .auth-kicker {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 10px;
            margin-bottom: 22px;
            border: 1px solid var(--wcb-brand-line);
            border-radius: 999px;
            background: var(--wcb-brand-soft);
            color: var(--wcb-brand-strong);
            font-size: 11px;
            font-weight: 650;
            letter-spacing: .04em;
          }
          .auth.auth-split h1 {
            margin: 0;
            color: var(--wcb-ink);
            font-size: clamp(38px, 4vw, 54px);
            line-height: .98;
            letter-spacing: -.055em;
            font-weight: 570;
          }
          .auth-split-form > p:not(.auth-error):not(.auth-return):not(.auth-switch) {
            margin: 18px 0 0;
            color: #71717a;
            font-size: 15px;
            line-height: 1.62;
          }
          .auth-provider-button {
            width: 100%;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            padding: 0 18px;
            border: 1px solid var(--wcb-brand);
            border-radius: 10px;
            background: var(--wcb-brand);
            color: #fff;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
            box-shadow: 0 8px 22px rgba(91,92,240,.16);
          }
          .auth-provider-button:hover:not(:disabled) {
            background: var(--wcb-brand-hover);
            border-color: var(--wcb-brand-hover);
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(91,92,240,.22);
          }
          .auth-provider-button:disabled {
            opacity: .66;
            cursor: wait;
          }
          .auth-provider-icon {
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: rgba(255,255,255,.14);
            font-size: 12px;
          }
          .auth-boundary-note {
            margin-top: 18px;
            padding: 14px 15px;
            border: 1px solid #ececf2;
            border-radius: 10px;
            background: #fafafa;
          }
          .auth-boundary-note > span {
            display: block;
            color: #34343a;
            font-size: 12px;
            font-weight: 650;
          }
          .auth-boundary-note p {
            margin: 5px 0 0;
            color: #81818a;
            font-size: 12px;
            line-height: 1.5;
          }
          .auth-error {
            margin: 12px 0 0;
            padding: 11px 12px;
            border: 1px solid #fecaca;
            border-radius: 9px;
            background: #fff7f7;
            color: #b42318;
            font-size: 12px;
            line-height: 1.45;
          }
          .auth-return {
            margin: 15px 0 0;
            color: #777780;
            font-size: 12px;
            line-height: 1.5;
          }
          .auth-return code {
            padding: 2px 5px;
            border-radius: 5px;
            background: #f3f3f6;
            color: #4b4b55;
          }
          .auth.auth-split .auth-switch {
            margin: 20px 0 0;
            color: #777780;
            font-size: 13px;
          }
          .auth.auth-split .auth-switch a {
            color: var(--wcb-brand-strong);
            font-weight: 650;
            text-decoration: none;
          }
          .auth.auth-split .auth-switch a:hover { text-decoration: underline; text-underline-offset: 3px; }
          .auth-split-foot {
            margin: 0;
            color: #a1a1aa;
            font-size: 11px;
          }

          .auth-split-visual {
            position: relative;
            min-width: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(38px, 5vw, 72px);
            background:
              radial-gradient(circle at 78% 14%, rgba(255,255,255,.20), transparent 30%),
              linear-gradient(145deg, #6a6bf7 0%, #5556e8 48%, #4243c7 100%);
            color: #fff;
          }
          .auth-visual-glow {
            position: absolute;
            width: 520px;
            height: 520px;
            right: -220px;
            top: -240px;
            border-radius: 50%;
            background: rgba(255,255,255,.14);
            filter: blur(12px);
            pointer-events: none;
          }
          .auth-visual-copy {
            position: relative;
            z-index: 2;
            max-width: 520px;
          }
          .auth-visual-copy > span {
            display: block;
            margin-bottom: 18px;
            color: rgba(255,255,255,.72);
            font-size: 11px;
            font-weight: 650;
            letter-spacing: .09em;
            text-transform: uppercase;
          }
          .auth-visual-copy h2 {
            margin: 0;
            color: #fff;
            font-size: clamp(42px, 4.5vw, 68px);
            line-height: .98;
            letter-spacing: -.055em;
            font-weight: 560;
          }
          .auth-visual-copy p {
            max-width: 430px;
            margin: 20px 0 0;
            color: rgba(255,255,255,.72);
            font-size: 14px;
            line-height: 1.6;
          }
          .auth-visual-frame {
            position: relative;
            z-index: 2;
            width: min(760px, 118%);
            margin: 56px -12% -10% 4%;
            padding: 7px;
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 18px;
            background: rgba(255,255,255,.12);
            box-shadow: 0 34px 90px rgba(25,25,90,.34);
            backdrop-filter: blur(10px);
          }
          .auth-visual-frame img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            background: #fff;
          }

          @media (max-width: 980px) {
            .auth.auth-split { grid-template-columns: 1fr; }
            .auth-split-visual { display: none; }
            .auth-split-panel { padding: 24px; }
            .auth-split-center { padding: 44px 0 56px; }
          }

          @media (max-width: 560px) {
            .auth-split-panel { min-height: 100svh; padding: 20px; }
            .auth-split-form { width: 100%; }
            .auth.auth-split h1 { font-size: 40px; }
            .auth-split-center { align-items: center; }
          }

          @media (prefers-reduced-motion: reduce) {
            .auth-provider-button { transition: none; }
            .auth-provider-button:hover:not(:disabled) { transform: none; }
          }
          EOF

          cat > src/phase4-brand-auth.test.ts <<'EOF'
          import fs from "node:fs"
          import { describe, expect, it } from "vitest"

          const app = fs.readFileSync("src/App.tsx", "utf8")
          const css = fs.readFileSync("src/phase4-brand.css", "utf8")
          const main = fs.readFileSync("src/main.tsx", "utf8")

          describe("Phase 4 WebCanBe brand and auth UI", () => {
            it("applies one electric-indigo brand layer after the other Phase 4 styles", () => {
              expect(main).toContain('import "./phase4-brand.css"')
              expect(main.indexOf('import "./phase4-brand.css"')).toBeGreaterThan(main.indexOf('import "./phase4-public-flow.css"'))
              expect(css).toContain("--wcb-brand: #5b5cf0")
              expect(css).toContain(".app-sidebar nav a.active")
              expect(css).toContain(".button.primary")
              expect(css).toContain(".workspace-actions .workspace-publish")
            })

            it("uses a shadcn-style split auth surface without inventing password auth", () => {
              expect(app).toContain('className="auth auth-split"')
              expect(app).toContain('className="auth-split-visual"')
              expect(app).toContain('src="/mainline/hero.webp"')
              expect(app).toContain("hostedProductClient.authStart()")
              expect(app).toContain('className="auth-provider-button"')
              expect(app).not.toContain('type="password"')
              expect(css).toContain(".auth.auth-split")
              expect(css).toContain(".auth-visual-frame")
            })
          })
          EOF

      - name: Verify brand/auth integration
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx vitest run src/phase4-brand-auth.test.ts src/phase4-public-flow.test.ts src/phase4-ux-foundation.test.ts src/phase4-operations.test.ts src/phase4-product-hub.test.ts
          npm run build

      - name: Commit brand/auth integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WebCanBe Phase 4 Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-brand-auth-ui.yml
          git add src/App.tsx src/main.tsx src/phase4-brand.css src/phase4-brand-auth.test.ts
          git commit -m "Apply WebCanBe brand and split auth UI"
          git push origin HEAD:phase-4-product-ux
