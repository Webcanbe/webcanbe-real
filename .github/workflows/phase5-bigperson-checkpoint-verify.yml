name: Phase 5 bigperson checkpoint verify
on:
  push:
    branches: [main, phase5-bigperson-control, phase5-hyperdrive-live, phase5-admin-live-control, phase5-cloudflare-typescript-runtime, phase5-session-created-at-fix]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare runtime profile
        run: npm run runtime:prepare
      - name: Secret scan
        run: npm run security:secrets
      - name: Bigperson and privileged authority regressions
        run: npx vitest run src/phase5-bigperson-control.test.ts src/phase5-bigperson-three-factor.test.ts src/phase5-bigperson-mutations.test.ts src/phase5-ready-qualification.test.ts src/phase5-editor-durable-export.test.ts src/phase5-launch-hardening.test.ts src/webcanbe-engine/phase3-hosted-product.test.ts
      - name: Worker syntax
        run: node --check worker/bigperson-auth.js && node --check worker/control-mutations.js && node --check worker/ready-qualification.js && node --check worker/index.js && node --check worker/postgres-session.js
      - name: Production build
        run: npm run build
      - name: Worker bundle dry run
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
