name: Phase 4 UX verify
on:
  push:
    branches:
      - phase-4-product-ux
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Focused UX tests
        run: npx vitest run src/phase3-landing.test.ts src/phase4-ux-foundation.test.ts
      - name: Production build
        run: npm run build
      - name: Verify Phase 3 and main refs unchanged
        run: |
          test "$(git ls-remote origin refs/heads/phase-3-hosted-product | cut -f1)" = "5d3aa70dfd42e5706a23bd881e97e46665948a30"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "dd2d9cf8ffa6d82e4fdbb3e0ab37fa43ea9f945b"
