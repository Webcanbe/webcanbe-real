name: Phase 5 worker-first test fix verify
on:
  push:
    branches: [phase5-worker-first-test-fix]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Secret scan
        run: npm run security:secrets
      - name: Focused Phase 5 and inherited Phase 4 tests
        run: npx vitest run src/phase5-brand.test.ts src/phase5-dashboard-polish.test.ts src/phase5-auth-production.test.ts src/phase5-google-branding.test.ts src/phase5-cloudflare-auth.test.ts src/phase5-firebase-auth.test.ts src/phase5-production-read-mode.test.ts src/phase5-production-public-smoke.test.ts src/phase5-launch-hardening.test.ts src/phase5-csp-compat.test.ts src/phase5-route-error-hardening.test.ts src/phase5-seo-metadata.test.ts src/phase5-rate-limit.test.ts src/phase5-privacy-current.test.ts src/phase5-db-backup-ops.test.ts src/phase5-cloudflare-rollback.test.ts src/phase5-secret-scan.test.ts worker/security-headers.test.js worker/readiness.test.js worker/telemetry.test.js worker/rate-limit.test.js worker/firebase-auth.test.js worker/product-catalog.test.js worker/postgres-session.test.js worker/product-private.test.js worker/account-profile.test.js src/hostedProductClient.test.ts src/phase4-brand-auth.test.ts src/phase4-final-shell.test.ts src/phase4-product-hub.test.ts src/phase4-public-flow.test.ts src/phase4-landing-webcanbe.test.ts
      - name: Worker syntax
        run: node --check scripts/security/scan-secrets.mjs && node --check scripts/production-smoke-public.mjs && node --check scripts/cloudflare-rollback.mjs && node --check scripts/db/backup.mjs && node --check scripts/db/verify-backup.mjs && node --check worker/index.js && node --check worker/readiness.js && node --check worker/telemetry.js && node --check worker/rate-limit.js && node --check worker/security-headers.js && node --check worker/firebase-auth.js && node --check worker/product-catalog.js && node --check worker/product-private.js && node --check worker/account-profile.js && node --check worker/hyperdrive.js && node --check worker/postgres-session.js
      - name: Production build
        run: npm run build
      - name: Worker bundle dry run
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
