name: Install pinned WebAuthn server dependency
on:
  push:
    branches: [phase5-bigperson-control]
permissions:
  contents: write
jobs:
  pin:
    if: "!contains(github.event.head_commit.message, 'Pin WebAuthn server dependency')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-bigperson-control
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve and pin SimpleWebAuthn
        run: npm install --save-exact --ignore-scripts @simplewebauthn/server @simplewebauthn/browser
      - name: Commit pinned dependency
        run: |
          git config user.name "Webcanbe CI"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Pin WebAuthn server dependency"
          git push origin HEAD:phase5-bigperson-control
